<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Emme Schedule & Caseload — live weekly schedules and client info" />
  <title>Emme — Schedule &amp; Caseload</title>
  <meta name="emme-build" content="2026-07-30-client-sync" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --green: #084339;
      --green-mid: #245E4D;
      --green-light: #4A7C6B;
      --pink: #f8cacb;
      --pink-dark: #dd9fa3;
      --yellow: #ffca34;
      --bg: #fef7fc;
      --surface: #ffffff;
      --border: rgba(8, 67, 57, 0.12);
      --text: #084339;
      --body: #2a3a38;
      --muted: rgba(8, 67, 57, 0.55);
      --faint: rgba(8, 67, 57, 0.28);
      --day-blue: #1e3a5f;
      --day-maroon: #6b2d3c;
      --radius: 0.75rem;
      --shadow: 0 4px 18px rgba(8, 67, 57, 0.08);
      --font-display: 'Comfortaa', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--body);
      min-height: 100vh;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .is-hidden { display: none !important; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.85rem 1.5rem;
      background: var(--green); color: #fff;
      box-shadow: 0 2px 14px rgba(8, 67, 57, 0.2);
    }
    .topbar__brand {
      font-family: var(--font-display); font-weight: 700; font-size: 1.35rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .topbar__brand span { opacity: 0.7; font-weight: 500; font-size: 0.95rem; }
    .topbar__actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.7rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9);
    }
    .sync-pill--live { background: rgba(255, 202, 52, 0.22); color: #fff; }
    .sync-pill--local { background: rgba(248, 202, 203, 0.25); }
    .sync-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #7dcea0;
      box-shadow: 0 0 0 0 rgba(125, 206, 160, 0.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(125, 206, 160, 0.45); }
      70% { box-shadow: 0 0 0 6px rgba(125, 206, 160, 0); }
      100% { box-shadow: 0 0 0 0 rgba(125, 206, 160, 0); }
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.45rem 0.85rem; border-radius: 0.55rem;
      font-weight: 600; font-size: 0.85rem;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    .btn--yellow { background: var(--yellow); color: var(--green); }
    .btn--yellow:hover { filter: brightness(0.97); }
    .btn--ghost {
      background: transparent; color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .btn--ghost:hover { background: rgba(255,255,255,0.08); }
    .btn--green { background: var(--green); color: #fff; }
    .btn--green:hover { background: var(--green-mid); }
    .btn--soft {
      background: rgba(8, 67, 57, 0.07); color: var(--green);
      border: 1px solid var(--border);
    }
    .btn--soft:hover { background: rgba(8, 67, 57, 0.12); }
    .btn--danger { background: #fde8ea; color: #8b2e3a; }
    .btn--danger:hover { background: #f9d0d5; }
    .btn--sm { padding: 0.3rem 0.55rem; font-size: 0.78rem; }
    .btn--icon { padding: 0.35rem; border-radius: 0.45rem; }

    .shell { max-width: 1400px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .toolbar__left, .toolbar__right { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    .board-tabs {
      display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center;
      padding: 0.25rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .board-tab {
      padding: 0.45rem 0.85rem; border-radius: 0.5rem;
      font-weight: 600; font-size: 0.85rem; color: var(--muted);
    }
    .board-tab:hover { color: var(--green); background: rgba(8,67,57,0.05); }
    .board-tab--active {
      background: var(--green); color: #fff;
    }

    .layout-switch {
      display: inline-flex; padding: 0.2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .layout-switch__btn {
      padding: 0.4rem 0.75rem; border-radius: 0.45rem;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .layout-switch__btn--active {
      background: var(--green); color: #fff;
    }

    .toast {
      position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 80;
      background: var(--green); color: #fff;
      padding: 0.75rem 1rem; border-radius: 0.65rem;
      box-shadow: 0 8px 24px rgba(8,67,57,0.25);
      font-size: 0.875rem; font-weight: 500;
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast--show { opacity: 1; transform: translateY(0); }

    /* Status pills */
    .status {
      display: inline-flex; align-items: center;
      padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
      border: 1px solid transparent;
    }
    .status--full { background: #f8cacb; color: #7a2f38; }
    .status--open4 { background: #d4edda; color: #1e5c33; }
    .status--open2, .status--open1 { background: #ffe8a3; color: #6b4e00; }
    .status--progress { background: #ffd0a8; color: #7a3d00; }
    .status--lunch { background: #cfe8f5; color: #1a4d66; }
    .status--makeup { background: #e4d4f5; color: #4b2d6b; }
    .status--closed { background: #6b2d3c; color: #fff; }
    .status--blank { background: #f0e8ef; color: var(--muted); }

    /* Schedule layout (boss-friendly day stacks) */
    .sched-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.7fr);
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 980px) {
      .sched-layout { grid-template-columns: 1fr; }
    }
    .day-stack { display: flex; flex-direction: column; gap: 1rem; }
    .day-block {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: var(--shadow);
    }
    .day-block__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; color: #fff; font-family: var(--font-display);
      font-weight: 700; font-size: 0.95rem;
    }
    .day-block__header--blue { background: var(--day-blue); }
    .day-block__header--maroon { background: var(--day-maroon); }
    .day-block__header .btn { color: #fff; border-color: rgba(255,255,255,0.35); }
    .slot-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .slot-table th {
      text-align: left; padding: 0.45rem 0.7rem;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); background: rgba(8,67,57,0.03);
      border-bottom: 1px solid var(--border);
    }
    .slot-table td {
      padding: 0.4rem 0.55rem; border-bottom: 1px solid rgba(8,67,57,0.06);
      vertical-align: middle;
    }
    .slot-table tr:last-child td { border-bottom: none; }
    .slot-table tr:hover td { background: rgba(8,67,57,0.025); }
    .cell-input, .cell-select {
      width: 100%; border: 1px solid transparent; background: transparent;
      border-radius: 0.4rem; padding: 0.3rem 0.4rem; color: var(--body);
    }
    .cell-input:hover, .cell-select:hover { border-color: var(--border); background: #fff; }
    .cell-input:focus, .cell-select:focus {
      outline: none; border-color: var(--green-light); background: #fff;
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }
    .slot-actions { display: flex; gap: 0.2rem; opacity: 0.35; }
    tr:hover .slot-actions { opacity: 1; }

    .client-side {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
      position: sticky; top: 4.5rem;
    }
    .client-side__header {
      background: var(--day-blue); color: #fff;
      padding: 0.7rem 0.9rem; font-family: var(--font-display);
      font-weight: 700; display: flex; justify-content: space-between; align-items: center;
    }
    .client-side__list { max-height: min(70vh, 720px); overflow: auto; }
    .client-side__row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 0.5rem;
      padding: 0.65rem 0.85rem; border-bottom: 1px solid rgba(8,67,57,0.06);
      align-items: center; cursor: pointer;
    }
    .client-side__row:hover { background: rgba(8,67,57,0.03); }
    .client-side__name { font-weight: 600; color: var(--green); font-size: 0.88rem; }
    .client-side__meta { font-size: 0.75rem; color: var(--muted); }
    .client-side__hours {
      font-size: 0.78rem; font-weight: 700; color: var(--green-mid);
      background: rgba(8,67,57,0.07); padding: 0.15rem 0.45rem; border-radius: 999px;
    }

    /* Spreadsheet layout */
    .sheet-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto;
    }
    .sheet-table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 0.86rem; }
    .sheet-table th {
      position: sticky; top: 0; z-index: 2;
      background: var(--green); color: #fff; text-align: left;
      padding: 0.55rem 0.7rem; font-size: 0.75rem; letter-spacing: 0.03em;
    }
    .sheet-day-row td {
      background: var(--day-blue); color: #fff; font-weight: 700;
      font-family: var(--font-display); padding: 0.5rem 0.7rem;
    }
    .sheet-day-row--maroon td { background: var(--day-maroon); }
    .sheet-table td {
      padding: 0.35rem 0.5rem; border-bottom: 1px solid rgba(8,67,57,0.07);
    }

    .sched-orient-vertical { display: flex; flex-direction: column; gap: 1rem; }
    .sched-orient-horizontal {
      display: flex; flex-direction: row; gap: 1rem;
      overflow-x: auto; padding-bottom: 0.5rem; align-items: flex-start;
    }
    .sched-orient-horizontal .day-block {
      min-width: min(560px, 88vw); flex: 0 0 auto;
    }
    .unified-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; table-layout: fixed; }
    .unified-table th {
      text-align: left; padding: 0.5rem 0.45rem;
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em;
      color: #fff; background: var(--green); cursor: pointer; user-select: none;
      border-right: 1px solid rgba(255,255,255,0.15);
    }
    .unified-table th:hover { filter: brightness(1.08); }
    .unified-table th .th-hint {
      display: block; font-size: 0.62rem; opacity: 0.75; font-weight: 500;
      text-transform: none; letter-spacing: 0;
    }
    .unified-table td {
      padding: 0.35rem 0.4rem; border-bottom: 1px solid rgba(8,67,57,0.07);
      vertical-align: top; border-right: 1px solid rgba(8,67,57,0.05);
    }
    .unified-table textarea.cell-input {
      min-height: 3.2rem; resize: vertical; line-height: 1.4; white-space: pre-wrap;
    }
    .col-collapsed { width: 2.15rem !important; max-width: 2.15rem !important; }
    .col-collapsed .th-label,
    .col-collapsed .th-hint,
    .col-collapsed .cell-input,
    .col-collapsed .cell-select,
    .col-collapsed textarea { display: none !important; }
    .col-tick { display: none; }
    .col-collapsed .col-tick {
      display: block; text-align: center; font-weight: 700;
      writing-mode: vertical-rl; transform: rotate(180deg);
      margin: 0.35rem auto; font-size: 0.68rem; letter-spacing: 0.05em;
    }
    th.col-collapsed .col-tick { color: #fff; }
    td.col-collapsed .col-tick { color: var(--green); }
    .col-time { width: 7.5rem; }
    .col-status { width: 10.5rem; }
    .col-clientName { width: 11.5rem; }
    .col-clientInfo { width: auto; }
    .col-lastDay { width: 7.5rem; }
    .col-actions { width: 4.5rem; }
    .col-drag { width: 2rem; text-align: center; }
    .drag-handle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.6rem; height: 1.6rem; border-radius: 0.35rem;
      color: var(--muted); cursor: grab; touch-action: none;
    }
    .drag-handle:hover { color: var(--green); background: rgba(8,67,57,0.07); }
    .drag-handle:active, tr.is-dragging .drag-handle { cursor: grabbing; }
    tr.is-dragging { opacity: 0.45; background: rgba(8,67,57,0.04); }
    tr.drop-before td { box-shadow: inset 0 2px 0 0 var(--yellow); }
    tr.drop-after td { box-shadow: inset 0 -2px 0 0 var(--yellow); }
    tbody.drop-empty { outline: 2px dashed var(--yellow); outline-offset: -2px; }

    /* Clients layout */
    .clients-panel {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .clients-panel__head {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: flex-end; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .clients-panel__hint {
      margin: 0.25rem 0 0; font-size: 0.8rem; color: var(--muted); max-width: 36rem;
    }
    .clients-panel__actions {
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
    }
    .clients-panel__actions input[type="search"] {
      min-width: 11rem; padding: 0.4rem 0.65rem;
      border: 1px solid var(--border); border-radius: 0.5rem; background: #fff;
    }
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .client-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .client-card__head {
      background: linear-gradient(135deg, var(--green), var(--green-mid));
      color: #fff; padding: 0.85rem 1rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
    }
    .client-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .client-card__sessions { font-size: 0.78rem; opacity: 0.85; margin-top: 0.2rem; }
    .client-card__body { padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
    .info-row {
      display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 0.4rem;
      align-items: start; font-size: 0.84rem;
    }
    .info-row__label { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; padding-top: 0.15rem; }
    .info-row__value { color: var(--body); word-break: break-word; }
    .info-row__value a { color: var(--green-mid); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .copy-btn {
      padding: 0.2rem; border-radius: 0.35rem; color: var(--muted);
    }
    .copy-btn:hover { background: rgba(8,67,57,0.07); color: var(--green); }
    .client-card__tasks {
      margin: 0 1rem 1rem; padding: 0.65rem 0.75rem;
      background: rgba(221, 159, 163, 0.12); border-radius: 0.55rem;
      border: 1px dashed rgba(221, 159, 163, 0.5);
    }
    .client-card__tasks h4 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: #8b4a52; margin-bottom: 0.35rem;
    }
    .client-card__tasks textarea {
      width: 100%; border: none; background: transparent; resize: vertical;
      min-height: 2.5rem; color: var(--body);
    }
    .client-card__tasks textarea:focus { outline: none; }

    .caseload-sheet {
      width: 100%; border-collapse: collapse; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); table-layout: fixed;
    }
    .caseload-sheet th {
      text-align: left; padding: 0.65rem 0.85rem; font-size: 0.75rem;
      letter-spacing: 0.04em; text-transform: uppercase; color: #fff;
    }
    .caseload-sheet th.col-client { background: #1e3a5f; width: 22%; }
    .caseload-sheet th.col-info { background: #245E4D; width: 48%; }
    .caseload-sheet th.col-tasks { background: #6b4a6e; width: 24%; }
    .caseload-sheet th.col-actions { background: #1e3a5f; width: 6%; }
    .caseload-sheet td {
      padding: 0.55rem 0.65rem; border-bottom: 1px solid rgba(8,67,57,0.08);
      vertical-align: top;
    }
    .caseload-sheet tr:hover td { background: rgba(8,67,57,0.025); }
    .caseload-name {
      width: 100%; border: 1px solid transparent; background: transparent;
      font-weight: 700; color: var(--green); padding: 0.35rem 0.4rem;
      border-radius: 0.4rem;
    }
    .caseload-info, .caseload-tasks {
      width: 100%; border: 1px solid transparent; background: transparent;
      color: var(--body); padding: 0.35rem 0.4rem; border-radius: 0.4rem;
      min-height: 6.5rem; resize: vertical; line-height: 1.45; font-size: 0.84rem;
      white-space: pre-wrap; font-family: var(--font-body);
    }
    .caseload-name:hover, .caseload-info:hover, .caseload-tasks:hover {
      border-color: var(--border); background: #fff;
    }
    .caseload-name:focus, .caseload-info:focus, .caseload-tasks:focus {
      outline: none; border-color: var(--green-light); background: #fff;
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }
    .caseload-meta {
      margin-top: 0.35rem; font-size: 0.75rem; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem;
    }
    .caseload-meta a { color: var(--green-mid); font-weight: 600; }

    .empty {
      text-align: center; padding: 2.5rem 1rem; color: var(--muted);
    }
    .empty h3 { font-family: var(--font-display); color: var(--green); margin-bottom: 0.35rem; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(8, 67, 57, 0.35);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal__panel {
      background: var(--surface); border-radius: 1rem;
      width: min(640px, 100%); max-height: 90vh; overflow: auto;
      box-shadow: 0 16px 48px rgba(8,67,57,0.25); padding: 1.25rem;
    }
    .modal__title {
      font-family: var(--font-display); font-size: 1.2rem; color: var(--green);
      margin-bottom: 1rem;
    }
    .field { margin-bottom: 0.75rem; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 0.55rem 0.7rem;
      border: 1px solid var(--border); border-radius: 0.5rem;
      background: #fff; color: var(--body);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--green-light);
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
    .modal__actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

    .dx-panel {
      margin-top: 1.25rem; padding: 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .dx-panel h3 {
      font-family: var(--font-display); font-size: 0.95rem; color: var(--green);
      margin-bottom: 0.5rem;
    }
    .dx-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .dx-chip {
      font-size: 0.75rem; padding: 0.25rem 0.55rem;
      background: rgba(8,67,57,0.06); border-radius: 999px; color: var(--green-mid);
    }

    .search-bar { margin-bottom: 1rem; }
    .search-bar input {
      width: min(420px, 100%); padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); border-radius: 0.55rem;
      background: var(--surface); color: var(--body);
      box-shadow: var(--shadow);
    }
    .search-bar input:focus {
      outline: none; border-color: var(--green-light);
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }

    .cell-select.status-tint--full { background: #f8cacb; }
    .cell-select.status-tint--open4 { background: #d4edda; }
    .cell-select.status-tint--open2,
    .cell-select.status-tint--open1 { background: #ffe8a3; }
    .cell-select.status-tint--progress { background: #ffd0a8; }
    .cell-select.status-tint--lunch { background: #cfe8f5; }
    .cell-select.status-tint--makeup { background: #e4d4f5; }
    .cell-select.status-tint--closed { background: #6b2d3c; color: #fff; }
    .cell-select.status-tint--blank { background: transparent; }

    .upload-drop {
      border: 2px dashed rgba(8,67,57,0.22);
      border-radius: 0.85rem;
      padding: 1.25rem;
      text-align: center;
      background: rgba(8,67,57,0.03);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-drop:hover, .upload-drop--active {
      border-color: var(--green-light);
      background: rgba(8,67,57,0.06);
    }
    .upload-drop strong { color: var(--green); display: block; margin-bottom: 0.25rem; }
    .upload-drop p { font-size: 0.82rem; color: var(--muted); }
    .upload-preview {
      margin-top: 0.85rem; padding: 0.75rem;
      background: rgba(8,67,57,0.04); border-radius: 0.55rem;
      font-size: 0.84rem; max-height: 220px; overflow: auto;
    }
    .upload-preview ul { padding-left: 1.1rem; margin-top: 0.35rem; }
    .upload-mode {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.85rem;
    }
    .upload-mode label {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.7rem; border-radius: 0.5rem;
      border: 1px solid var(--border); cursor: pointer; font-size: 0.82rem; font-weight: 600;
    }
    .upload-mode input { accent-color: var(--green); }
    .upload-busy {
      display: inline-flex; align-items: center; gap: 0.45rem;
      color: var(--green); font-weight: 600; font-size: 0.85rem; margin-top: 0.75rem;
    }
    .spin {
      width: 0.9rem; height: 0.9rem; border-radius: 50%;
      border: 2px solid rgba(8,67,57,0.2); border-top-color: var(--green);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    [data-lucide] { width: 1rem; height: 1rem; display: block; }
    .icon-sm [data-lucide], .icon-sm { width: 0.9rem; height: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      Emme <span>/ Schedule &amp; Caseload</span>
    </a>
    <div class="topbar__actions">
      <span class="sync-pill" id="js-sync-pill" title="Sync status">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="js-sync-label">Loading…</span>
      </span>
      <button type="button" class="btn btn--ghost" id="js-export" title="Export JSON backup">Export</button>
      <button type="button" class="btn btn--ghost" id="js-import" title="Import Excel, CSV, JSON, or other files">Import</button>
      <!-- No accept= — Windows “Custom Files” / JSON-only filter comes from accept=".json" -->
      <input type="file" id="js-import-file" class="sr-only" multiple />
      <button type="button" class="btn btn--yellow" id="js-upload" title="Upload a caseload or schedule file">
        <i data-lucide="upload"></i> Upload
      </button>
      <a class="btn btn--ghost" href="index.html">← Dashboard</a>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div class="toolbar__left">
        <div class="board-tabs" id="js-board-tabs" role="tablist" aria-label="Schedules"></div>
        <button type="button" class="btn btn--soft btn--sm" id="js-add-board" title="Add schedule board">+ Board</button>
        <button type="button" class="btn btn--soft btn--sm" id="js-rename-board" title="Rename board">Rename</button>
        <button type="button" class="btn btn--danger btn--sm" id="js-delete-board" title="Delete board">Delete</button>
      </div>
      <div class="toolbar__right">
        <div class="layout-switch" role="group" aria-label="Orientation">
          <button type="button" class="layout-switch__btn layout-switch__btn--active" data-orient="vertical" id="js-orient-vertical">
            <i data-lucide="rows-3"></i> Vertical
          </button>
          <button type="button" class="layout-switch__btn" data-orient="horizontal" id="js-orient-horizontal">
            <i data-lucide="columns-3"></i> Horizontal
          </button>
        </div>
        <button type="button" class="btn btn--soft btn--sm" id="js-expand-cols" title="Expand all columns">Expand cols</button>
        <button type="button" class="btn btn--green btn--sm" id="js-add-slot">+ Slot</button>
        <button type="button" class="btn btn--soft btn--sm" id="js-add-day">+ Day</button>
      </div>
    </div>

    <div class="search-bar" id="js-schedule-search-wrap">
      <input type="search" id="js-schedule-search" placeholder="Search by client name or info…" aria-label="Search schedule" />
    </div>

    <div id="js-view-main"></div>

    <section class="clients-panel" id="js-clients-panel" aria-label="Caseload clients">
      <div class="clients-panel__head">
        <div>
          <h3 style="margin:0">Caseload</h3>
          <p class="clients-panel__hint">Info on these tiles fills matching Client Info cells in the schedule (by name).</p>
        </div>
        <div class="clients-panel__actions">
          <input type="search" id="js-client-search" placeholder="Search clients…" aria-label="Search clients" />
          <button type="button" class="btn btn--soft btn--sm" id="js-sync-clients" title="Fill empty schedule Client Info from matching clients">Fill schedule</button>
          <button type="button" class="btn btn--green btn--sm" id="js-add-client">+ Client</button>
        </div>
      </div>
      <div class="client-grid" id="js-clients-grid"></div>
    </section>

    <section class="dx-panel" id="js-dx-panel" aria-label="Diagnostic codes">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
        <h3 style="margin:0">Diagnostic codes</h3>
        <button type="button" class="btn btn--soft btn--sm" id="js-edit-dx">Edit codes</button>
      </div>
      <div class="dx-list" id="js-dx-list"></div>
    </section>
  </main>

  <div class="toast" id="js-toast" role="status" aria-live="polite"></div>

  <div class="modal is-hidden" id="js-modal" role="dialog" aria-modal="true" aria-labelledby="js-modal-title">
    <div class="modal__panel">
      <h2 class="modal__title" id="js-modal-title">Edit</h2>
      <div id="js-modal-body"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--soft" id="js-modal-cancel">Cancel</button>
        <button type="button" class="btn btn--green" id="js-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  var STORAGE_KEY = 'emme_schedule_workspace_v1';
  var ORIENT_KEY = 'emme_schedule_orient';
  var COLLAPSE_KEY = 'emme_schedule_collapsed_cols';
  var BOARD_KEY = 'emme_schedule_board';
  var POLL_MS = 6000;
  var SAVE_DEBOUNCE_MS = 700;

  var SCHEDULE_COLS = [
    { id: 'time', label: 'Appointment Time', abr: 'Time' },
    { id: 'status', label: 'Status', abr: 'Status' },
    { id: 'clientName', label: 'Client Name', abr: 'Name' },
    { id: 'clientInfo', label: 'Client Info', abr: 'Info' },
    { id: 'lastDay', label: 'Last Day', abr: 'Last' }
  ];

  function loadCollapsedCols() {
    try {
      var raw = localStorage.getItem(COLLAPSE_KEY);
      if (raw) return JSON.parse(raw) || {};
    } catch (_) {}
    return {};
  }

  var STATUS_OPTIONS = [
    { value: '', label: '—', cls: 'blank' },
    { value: 'Full', label: 'Full', cls: 'full' },
    { value: 'Open 4x', label: 'Open 4x', cls: 'open4' },
    { value: 'Open 2x (1&3)', label: 'Open 2x (1&3)', cls: 'open2' },
    { value: 'Open 2x (2&4)', label: 'Open 2x (2&4)', cls: 'open2' },
    { value: 'Open 1x (1)', label: 'Open 1x (1)', cls: 'open1' },
    { value: 'Open 1x (2)', label: 'Open 1x (2)', cls: 'open1' },
    { value: 'Open 1x (3)', label: 'Open 1x (3)', cls: 'open1' },
    { value: 'Open 1x (4)', label: 'Open 1x (4)', cls: 'open1' },
    { value: 'Scheduling In Progress', label: 'Scheduling In Progress', cls: 'progress' },
    { value: 'Lunch', label: 'Lunch', cls: 'lunch' },
    { value: 'Makeup', label: 'Makeup', cls: 'makeup' },
    { value: 'Not Open', label: 'Not Open', cls: 'closed' }
  ];

  var DEFAULT_DX = [
    'F80.0 — Phonological Disorder',
    'F80.1 — Expressive Language Disorder',
    'F80.2 — Mixed Receptive-Expressive Language Disorder',
    'F80.81 — Childhood Onset Fluency Disorder',
    'F80.9 — Developmental Disorder of Speech and Language, Unspecified',
    'F84.0 — Autistic Disorder',
    'R48.8 — Other Symbolic Dysfunctions (Pragmatic Language)'
  ];

  var state = {
    workspace: null,
    cloudConfigured: false,
    orientation: localStorage.getItem(ORIENT_KEY) || 'vertical',
    collapsedCols: loadCollapsedCols(),
    activeBoardId: localStorage.getItem(BOARD_KEY) || '',
    scheduleQuery: '',
    clientQuery: '',
    saving: false,
    dirty: false,
    lastRemoteUpdatedAt: null,
    pollTimer: null,
    saveTimer: null,
    modalMode: null,
    modalContext: null,
    suppressPoll: false
  };

  var bc = null;
  try { bc = new BroadcastChannel('emme_schedule_sync'); } catch (_) {}

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  function statusClass(value) {
    var found = STATUS_OPTIONS.find(function (s) { return s.value === value; });
    return found ? found.cls : 'blank';
  }

  function toast(msg) {
    var el = document.getElementById('js-toast');
    el.textContent = msg;
    el.classList.add('toast--show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('toast--show'); }, 2200);
  }

  async function copyText(text) {
    var value = String(text || '').trim();
    if (!value) return;
    try {
      await navigator.clipboard.writeText(value);
      toast('Copied');
    } catch (_) {
      var ta = document.createElement('textarea');
      ta.value = value;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast('Copied');
    }
  }

  function iconize() {
    if (window.lucide && lucide.createIcons) lucide.createIcons();
  }

  function defaultBoard(name) {
    var days = [
      { id: uid('day'), name: 'Monday', color: 'blue', slots: [] },
      { id: uid('day'), name: 'Tuesday', color: 'maroon', slots: [] },
      { id: uid('day'), name: 'Wednesday', color: 'blue', slots: [] },
      { id: uid('day'), name: 'Thursday', color: 'maroon', slots: [] },
      { id: uid('day'), name: 'Friday', color: 'blue', slots: [] }
    ];
    var starterTimes = {
      Monday: ['4:00 PM', '4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Tuesday: ['4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Wednesday: ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '4:30 PM', '5:30 PM', '6:30 PM'],
      Thursday: ['9:00 AM', '10:00 AM', '11:00 AM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Friday: ['4:30 PM', '5:30 PM', '6:30 PM']
    };
    days.forEach(function (day) {
      (starterTimes[day.name] || []).forEach(function (time) {
        day.slots.push({ id: uid('slot'), time: time, status: '', clientName: '', clientInfo: '', notes: '', lastDay: '' });
      });
    });
    return { id: uid('board'), name: name || 'Current Schedule', days: days };
  }

  function seedWorkspace() {
    return {
      version: 1,
      updatedAt: new Date().toISOString(),
      boards: [
        defaultBoard('Current Schedule'),
        { id: uid('board'), name: "Summer '26 Schedule", days: defaultBoard().days.map(function (d) {
          return { id: uid('day'), name: d.name, color: d.color, slots: d.slots.map(function (s) {
            return { id: uid('slot'), time: s.time, status: '', clientName: '', clientInfo: '', notes: '', lastDay: '' };
          }) };
        }) },
        { id: uid('board'), name: 'Clients not in regular spot', days: [] }
      ],
      clients: [],
      dxCodes: DEFAULT_DX.slice()
    };
  }

  function activeBoard() {
    var ws = state.workspace;
    if (!ws || !ws.boards.length) return null;
    var board = ws.boards.find(function (b) { return b.id === state.activeBoardId; });
    if (!board) {
      board = ws.boards[0];
      state.activeBoardId = board.id;
      localStorage.setItem(BOARD_KEY, board.id);
    }
    return board;
  }

  function setSyncLabel(text, mode) {
    var pill = document.getElementById('js-sync-pill');
    var label = document.getElementById('js-sync-label');
    label.textContent = text;
    pill.classList.toggle('sync-pill--live', mode === 'live');
    pill.classList.toggle('sync-pill--local', mode === 'local');
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) { return null; }
  }

  function saveLocal(workspace) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(workspace));
    if (bc) {
      try { bc.postMessage({ type: 'workspace', updatedAt: workspace.updatedAt }); } catch (_) {}
    }
  }

  async function loadCloud() {
    var res = await fetch('/api/schedule', { credentials: 'include' });
    var data = await res.json().catch(function () { return {}; });
    if (res.status === 503 || data.configured === false) {
      return { configured: false };
    }
    if (!res.ok) throw new Error(data.error || 'Could not load schedule');
    return { configured: true, workspace: data.workspace };
  }

  async function saveCloud(workspace) {
    var res = await fetch('/api/schedule', {
      method: 'PUT',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workspace: workspace })
    });
    var data = await res.json().catch(function () { return {}; });
    if (res.status === 503 || data.configured === false) {
      return { configured: false };
    }
    if (!res.ok) throw new Error(data.error || 'Could not save schedule');
    return { configured: true, workspace: data.workspace };
  }

  async function pollMeta() {
    if (!state.cloudConfigured || state.suppressPoll || state.dirty || state.saving) return;
    try {
      var res = await fetch('/api/schedule/meta', { credentials: 'include' });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.configured) return;
      if (data.updatedAt && state.lastRemoteUpdatedAt && data.updatedAt !== state.lastRemoteUpdatedAt) {
        var loaded = await loadCloud();
        if (loaded.configured && loaded.workspace) {
          setWorkspace(loaded.workspace);
          state.lastRemoteUpdatedAt = loaded.workspace.updatedAt;
          saveLocal(state.workspace);
          renderAll();
          setSyncLabel('Live · updated', 'live');
        }
      }
    } catch (_) {}
  }

  function scheduleSave() {
    state.dirty = true;
    setSyncLabel(state.cloudConfigured ? 'Saving…' : 'Saving on device…', state.cloudConfigured ? 'live' : 'local');
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(persist, SAVE_DEBOUNCE_MS);
  }

  async function persist() {
    if (!state.workspace) return;
    state.saving = true;
    state.suppressPoll = true;
    state.workspace.updatedAt = new Date().toISOString();
    saveLocal(state.workspace);
    try {
      if (state.cloudConfigured) {
        var result = await saveCloud(state.workspace);
        if (result.configured && result.workspace) {
          setWorkspace(result.workspace);
          state.lastRemoteUpdatedAt = result.workspace.updatedAt;
          saveLocal(state.workspace);
          setSyncLabel('Live sync on', 'live');
        } else {
          state.cloudConfigured = false;
          setSyncLabel('Saved on this device', 'local');
        }
      } else {
        setSyncLabel('Saved on this device', 'local');
      }
      state.dirty = false;
    } catch (err) {
      setSyncLabel('Save failed — retrying', state.cloudConfigured ? 'live' : 'local');
      toast(err.message || 'Save failed');
    } finally {
      state.saving = false;
      setTimeout(function () { state.suppressPoll = false; }, 1200);
    }
  }

  function mutate(fn) {
    fn();
    renderAll();
    scheduleSave();
  }

  /* ─── Rendering ─── */

  function renderBoardTabs() {
    var el = document.getElementById('js-board-tabs');
    var boards = state.workspace.boards;
    el.innerHTML = boards.map(function (b) {
      var active = b.id === state.activeBoardId ? ' board-tab--active' : '';
      return '<button type="button" class="board-tab' + active + '" data-board="' + b.id + '" role="tab" aria-selected="' + (b.id === state.activeBoardId) + '">' +
        escapeHtml(b.name) + '</button>';
    }).join('');
  }

  function renderStatusSelect(value, attrs) {
    var cls = statusClass(value);
    return '<select class="cell-select status-tint--' + cls + '" ' + (attrs || '') + '>' +
      STATUS_OPTIONS.map(function (s) {
        return '<option value="' + escapeAttr(s.value) + '"' + (s.value === value ? ' selected' : '') + '>' +
          escapeHtml(s.label) + '</option>';
      }).join('') + '</select>';
  }

  function tintStatusSelect(el) {
    if (!el || !el.classList.contains('cell-select')) return;
    STATUS_OPTIONS.forEach(function (s) {
      el.classList.remove('status-tint--' + s.cls);
    });
    el.classList.add('status-tint--' + statusClass(el.value));
  }

  function slotClientName(slot) {
    return String((slot && (slot.clientName || slot.notes)) || '').trim();
  }

  function normalizePersonName(name) {
    return String(name || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function findClientByName(name) {
    var key = normalizePersonName(name);
    if (!key || key.length < 2 || !state.workspace) return null;
    var clients = state.workspace.clients || [];
    var exact = [];
    var soft = [];
    clients.forEach(function (c) {
      var cn = normalizePersonName(c.name);
      if (!cn) return;
      if (cn === key) exact.push(c);
      else if (cn.indexOf(key) !== -1 || key.indexOf(cn) !== -1) soft.push(c);
    });
    if (exact.length) return exact[0];
    if (soft.length === 1) return soft[0];
    return null;
  }

  function slotClientInfo(slot) {
    if (!slot) return '';
    if (slot.clientInfo && String(slot.clientInfo).trim()) return String(slot.clientInfo);
    var match = findClientByName(slotClientName(slot));
    return match ? formatInformationCard(match) : '';
  }

  /** Push caseload tile info into schedule rows with the same client name. */
  function syncClientInfoToSlots(client, opts) {
    opts = opts || {};
    var force = !!opts.force;
    if (!client || !state.workspace) return 0;
    var key = normalizePersonName(client.name);
    if (!key) return 0;
    var info = formatInformationCard(client);
    var count = 0;
    (state.workspace.boards || []).forEach(function (board) {
      (board.days || []).forEach(function (day) {
        (day.slots || []).forEach(function (slot) {
          if (normalizePersonName(slotClientName(slot)) !== key) return;
          var existing = String(slot.clientInfo || '').trim();
          if (force || !existing) {
            slot.clientInfo = info;
            count += 1;
          }
        });
      });
    });
    return count;
  }

  function syncAllClientsToSchedule(opts) {
    var total = 0;
    (state.workspace.clients || []).forEach(function (c) {
      total += syncClientInfoToSlots(c, opts);
    });
    return total;
  }

  function applyClientNameToSlot(slot, name) {
    slot.clientName = name;
    slot.notes = name;
    var match = findClientByName(name);
    if (!match) return;
    var info = formatInformationCard(match);
    if (!info) return;
    // Fill empty info, or refresh if it still matches the previous auto card for this client
    var existing = String(slot.clientInfo || '').trim();
    if (!existing || existing === info) {
      slot.clientInfo = info;
    }
  }

  function colClass(id) {
    return 'col-' + id + (state.collapsedCols[id] ? ' col-collapsed' : '');
  }

  function renderColHeaders() {
    return '<th class="col-drag" title="Drag rows to reorder"></th>' + SCHEDULE_COLS.map(function (col) {
      return '<th class="' + colClass(col.id) + '" data-collapse-col="' + col.id + '" title="Click to collapse/expand">' +
        '<span class="th-label">' + escapeHtml(col.label) + '</span>' +
        '<span class="th-hint">click to collapse</span>' +
        '<span class="col-tick">' + escapeHtml(col.abr) + '</span>' +
      '</th>';
    }).join('') + '<th class="col-actions"></th>';
  }

  function renderSlotRow(day, slot) {
    var q = (state.scheduleQuery || '').toLowerCase().trim();
    var name = slotClientName(slot);
    var info = slotClientInfo(slot);
    if (q) {
      var blob = [slot.time, slot.status, name, info, slot.lastDay].join(' ').toLowerCase();
      if (blob.indexOf(q) === -1) return '';
    }
    return '<tr data-day="' + day.id + '" data-slot="' + slot.id + '">' +
      '<td class="col-drag">' +
        '<span class="drag-handle" draggable="true" data-drag-handle title="Drag to reorder" aria-label="Drag to reorder" role="button" tabindex="0">' +
          '<i data-lucide="grip-vertical"></i>' +
        '</span>' +
      '</td>' +
      '<td class="' + colClass('time') + '"><input class="cell-input" data-field="time" value="' + escapeAttr(slot.time || '') + '" placeholder="4:30 PM" /><span class="col-tick">Time</span></td>' +
      '<td class="' + colClass('status') + '">' + renderStatusSelect(slot.status || '', 'data-field="status"') + '<span class="col-tick">Status</span></td>' +
      '<td class="' + colClass('clientName') + '"><input class="cell-input" data-field="clientName" value="' + escapeAttr(name) + '" placeholder="Client name" /><span class="col-tick">Name</span></td>' +
      '<td class="' + colClass('clientInfo') + '"><textarea class="cell-input" data-field="clientInfo" placeholder="DOB, parents, email, phone…">' + escapeHtml(info) + '</textarea><span class="col-tick">Info</span></td>' +
      '<td class="' + colClass('lastDay') + '"><input class="cell-input" data-field="lastDay" value="' + escapeAttr(slot.lastDay || '') + '" placeholder="Last day" /><span class="col-tick">Last</span></td>' +

  function renderDayBlock(day) {

          (rows || '<tr class="empty-row"><td colspan="7" style="padding:0.85rem;color:var(--muted)">No slots — use + Slot, or drag a row here</td></tr>') +

  function renderUnifiedSchedule() {

      (blocks || '<div class="empty"><h3>No matches</h3><p>Try a different search.</p></div>') +

  function renderClientCard(c) {

          '<button type="button" class="btn btn--icon btn--ghost" data-action="del-client" data-client="' + escapeAttr(c.id) + '" title="Delete"><i data-lucide="trash-2"></i></button>' +

  function renderClientsPanel() {
    var grid = document.getElementById('js-clients-grid');
    if (!grid || !state.workspace) return;
    var q = (state.clientQuery || '').toLowerCase().trim();
    var clients = (state.workspace.clients || []).filter(function (c) {
      if (!q) return true;
      var blob = [c.name, formatInformationCard(c), c.tasks, c.sessions].join(' ').toLowerCase();
      return blob.indexOf(q) !== -1;
    });
    if (!clients.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">' +
        '<h3>' + (q ? 'No matching clients' : 'No caseload yet') + '</h3>' +
        '<p>' + (q ? 'Try a different search.' : 'Import a caseload sheet or add a client. Matching names will fill schedule Client Info.') + '</p>' +
        (!q ? '<button type="button" class="btn btn--green" id="js-empty-add-client">+ Client</button>' : '') +
        '</div>';
      return;
    }
    grid.innerHTML = clients.map(renderClientCard).join('');

  function renderAll() {
    renderBoardTabs();
    renderUnifiedSchedule();
    renderClientsPanel();
    renderDx();
    iconize();
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(str) { return escapeHtml(str); }

  function findSlot(dayId, slotId) {
    var board = activeBoard();
    if (!board) return null;
    var day = (board.days || []).find(function (d) { return d.id === dayId; });
    if (!day) return null;
    var slot = (day.slots || []).find(function (s) { return s.id === slotId; });
    return slot ? { day: day, slot: slot } : null;
  }

  /* ─── Modal ─── */

  function openModal(title, bodyHtml, mode, context) {
    state.modalMode = mode;
    state.modalContext = context || null;
    document.getElementById('js-modal-title').textContent = title;
    document.getElementById('js-modal-body').innerHTML = bodyHtml;
    document.getElementById('js-modal-save').textContent = mode === 'upload-apply' ? 'Apply to schedule' : 'Save';
    document.getElementById('js-modal').classList.remove('is-hidden');
  }

  function closeModal() {
    document.getElementById('js-modal').classList.add('is-hidden');
    document.getElementById('js-modal-save').textContent = 'Save';
    state.modalMode = null;
    state.modalContext = null;
  }

  function clientFormHtml(c) {
    c = c || {};
    return '<div class="field"><label>Client</label><input id="m-name" value="' + escapeAttr(c.name || '') + '" placeholder="Full client name" /></div>' +
      '<div class="field"><label>Information Card</label><textarea id="m-information" rows="8" placeholder="DOB:&#10;Parents:&#10;Medicaid #:&#10;Email:&#10;Phone:&#10;Sessions:&#10;Agency:&#10;Service Coordinator:&#10;SC Email:">' +
        escapeHtml(formatInformationCard(c)) + '</textarea></div>' +
      '<div class="field-grid">' +
        '<div class="field"><label>Sessions (short)</label><input id="m-sessions" value="' + escapeAttr(c.sessions || '') + '" placeholder="Wednesday 6:30" /></div>' +
        '<div class="field"><label>Hours</label><input id="m-hours" value="' + escapeAttr(c.hours || '') + '" placeholder="0.5" /></div>' +
      '</div>' +
      '<div class="field"><label>Tasks To Be Completed</label><textarea id="m-tasks" rows="3">' + escapeHtml(c.tasks || '') + '</textarea></div>';

  function readClientForm() {
    var information = val('m-information');
    var parsed = parseInfoCard(information);
    return {
      name: val('m-name'),
      information: information,
      dob: parsed.dob || '',
      parents: parsed.parents || '',
      medicaid: parsed.medicaid || '',
      email: parsed.email || '',
      phone: parsed.phone || '',
      sessions: val('m-sessions') || parsed.sessions || '',
      agency: parsed.agency || '',
      serviceCoordinator: parsed.serviceCoordinator || '',
      scEmail: parsed.scEmail || '',
      tasks: val('m-tasks'),
      hours: val('m-hours')
    };

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function openClientEditor(clientId) {
    var client = (state.workspace.clients || []).find(function (c) { return c.id === clientId; });
    openModal(client ? 'Edit client' : 'Add client', clientFormHtml(client), client ? 'edit-client' : 'add-client', { id: clientId });
  }

  function findDayById(dayId) {
    var board = activeBoard();
    if (!board) return null;
    return (board.days || []).find(function (d) { return d.id === dayId; }) || null;
  }

  function moveSlot(fromDayId, slotId, toDayId, beforeSlotId) {
    if (!fromDayId || !slotId || !toDayId) return false;
    var fromDay = findDayById(fromDayId);
    var toDay = findDayById(toDayId);
    if (!fromDay || !toDay) return false;
    var fromIdx = (fromDay.slots || []).findIndex(function (s) { return s.id === slotId; });
    if (fromIdx < 0) return false;

    // Same position — no-op
    if (fromDayId === toDayId && beforeSlotId === slotId) return false;
    if (fromDayId === toDayId && !beforeSlotId && fromIdx === fromDay.slots.length - 1) return false;
    if (fromDayId === toDayId && beforeSlotId) {
      var beforeIdx = fromDay.slots.findIndex(function (s) { return s.id === beforeSlotId; });
      if (beforeIdx === fromIdx || beforeIdx === fromIdx + 1) return false;
    }

    var slot = fromDay.slots.splice(fromIdx, 1)[0];
    if (beforeSlotId) {
      var insertAt = toDay.slots.findIndex(function (s) { return s.id === beforeSlotId; });
      if (insertAt < 0) toDay.slots.push(slot);
      else toDay.slots.splice(insertAt, 0, slot);
    } else {
      toDay.slots.push(slot);
    }
    return true;
  }

  var rowDrag = { active: false, dayId: '', slotId: '', row: null };

  function clearDropMarkers() {
    document.querySelectorAll('tr.drop-before, tr.drop-after, tr.is-dragging').forEach(function (el) {
      el.classList.remove('drop-before', 'drop-after', 'is-dragging');
    });
    document.querySelectorAll('tbody.drop-empty').forEach(function (el) {
      el.classList.remove('drop-empty');
    });
  }

  document.addEventListener('dragstart', function (e) {
    var handle = e.target.closest('[data-drag-handle]');
    if (!handle) return;
    var row = handle.closest('tr[data-slot]');
    if (!row) return;
    e.stopPropagation();
    rowDrag.active = true;
    rowDrag.dayId = row.getAttribute('data-day') || '';
    rowDrag.slotId = row.getAttribute('data-slot') || '';
    rowDrag.row = row;
    row.classList.add('is-dragging');
    try {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', rowDrag.slotId);
      // Better ghost: use the whole row if supported
      if (e.dataTransfer.setDragImage) {
        e.dataTransfer.setDragImage(row, 24, 16);
      }
    } catch (_) {}
  });

  document.addEventListener('dragend', function () {
    rowDrag.active = false;
    rowDrag.dayId = '';
    rowDrag.slotId = '';
    rowDrag.row = null;
    clearDropMarkers();
  });

  document.addEventListener('dragover', function (e) {
    if (!rowDrag.active) return;
    var row = e.target.closest('tr[data-slot]');
    var tbody = e.target.closest('tbody[data-drop-day]');
    if (!row && !tbody) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}

    clearDropMarkers();
    if (rowDrag.row) rowDrag.row.classList.add('is-dragging');

    if (row && row.getAttribute('data-slot') !== rowDrag.slotId) {
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.add(before ? 'drop-before' : 'drop-after');
    } else if (tbody && (!row || tbody.querySelector('.empty-row'))) {
      tbody.classList.add('drop-empty');
    }
  });

  document.addEventListener('drop', function (e) {
    if (!rowDrag.active) return;
    var row = e.target.closest('tr[data-slot]');
    var tbody = e.target.closest('tbody[data-drop-day]');
    if (!row && !tbody) return;
    e.preventDefault();

    var fromDayId = rowDrag.dayId;
    var slotId = rowDrag.slotId;
    var toDayId = '';
    var beforeSlotId = null;

    if (row && row.getAttribute('data-slot') !== slotId) {
      toDayId = row.getAttribute('data-day') || '';
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      if (before) {
        beforeSlotId = row.getAttribute('data-slot');
      } else {
        var next = row.nextElementSibling;
        beforeSlotId = (next && next.getAttribute('data-slot')) ? next.getAttribute('data-slot') : null;
        toDayId = row.getAttribute('data-day') || toDayId;
      }
    } else if (tbody) {
      toDayId = tbody.getAttribute('data-drop-day') || '';
      beforeSlotId = null; // append
    }

    clearDropMarkers();
    rowDrag.active = false;

    if (!toDayId || !slotId) return;
    mutate(function () {
      moveSlot(fromDayId, slotId, toDayId, beforeSlotId);
    });
  });

  /* ─── Events ─── */

  function onSlotFieldChange(target) {
    var tr = target.closest('tr[data-slot]');
    if (!tr) return;
    var found = findSlot(tr.getAttribute('data-day'), tr.getAttribute('data-slot'));
    if (!found) return;
    var field = target.getAttribute('data-field');
    if (!field) return;
    if (field === 'clientName') {
      applyClientNameToSlot(found.slot, target.value);
      // Refresh info cell if we auto-filled
      var infoCell = tr.querySelector('[data-field="clientInfo"]');
      if (infoCell && found.slot.clientInfo != null && infoCell.value !== found.slot.clientInfo) {
        infoCell.value = found.slot.clientInfo;
      }
    } else {
      found.slot[field] = target.value;
    }
    if (field === 'status') tintStatusSelect(target);
    scheduleSave();
  }

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('.cell-input, .cell-select')) onSlotFieldChange(t);
    if (t.matches('[data-client-field]')) {
      var clientId = t.getAttribute('data-client');
      var field = t.getAttribute('data-client-field');
      var client = state.workspace.clients.find(function (c) { return c.id === clientId; });
      if (!client || !field) return;
      if (field === 'information') {
        applyInformationCardToClient(client, t.value);
        syncClientInfoToSlots(client, { force: true });
        renderUnifiedSchedule();
        iconize();
      } else {
        client[field] = t.value;
      }
      scheduleSave();
    }
    if (t.matches('textarea[data-client-tasks]')) {
      var id = t.getAttribute('data-client-tasks');
      var c2 = state.workspace.clients.find(function (c) { return c.id === id; });
      if (c2) {
        c2.tasks = t.value;
        scheduleSave();
      }
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.matches('.cell-select')) onSlotFieldChange(e.target);
  });

  document.addEventListener('click', function (e) {
    var orientBtn = e.target.closest('[data-orient]');
    if (orientBtn) {
      state.orientation = orientBtn.getAttribute('data-orient') || 'vertical';
      localStorage.setItem(ORIENT_KEY, state.orientation);
      renderAll();
      return;
    }

    var collapseBtn = e.target.closest('[data-collapse-col]');
    if (collapseBtn) {
      var colId = collapseBtn.getAttribute('data-collapse-col');
      state.collapsedCols[colId] = !state.collapsedCols[colId];
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state.collapsedCols));
      renderAll();
      return;
    }

    var tab = e.target.closest('[data-board]');
    if (tab) {
      state.activeBoardId = tab.getAttribute('data-board');
      localStorage.setItem(BOARD_KEY, state.activeBoardId);
      renderAll();
      return;
    }

    var copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      copyText(copyBtn.getAttribute('data-copy'));
      return;
    }

    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      var action = actionBtn.getAttribute('data-action');
      var dayId = actionBtn.getAttribute('data-day') || (actionBtn.closest('[data-day]') && actionBtn.closest('[data-day]').getAttribute('data-day'));
      var slotId = actionBtn.closest('[data-slot]') && actionBtn.closest('[data-slot]').getAttribute('data-slot');
      var clientId = actionBtn.getAttribute('data-client');

      if (action === 'del-slot' && dayId && slotId) {
        mutate(function () {
          var board = activeBoard();
          var day = board.days.find(function (d) { return d.id === dayId; });
          if (day) day.slots = day.slots.filter(function (s) { return s.id !== slotId; });
        });
      }
      if (action === 'dup-slot' && dayId && slotId) {
        mutate(function () {
          var found = findSlot(dayId, slotId);
          if (!found) return;
          var copy = Object.assign({}, found.slot, { id: uid('slot') });
          var idx = found.day.slots.findIndex(function (s) { return s.id === slotId; });
          found.day.slots.splice(idx + 1, 0, copy);
        });
      }
      if (action === 'add-slot-day' && dayId) {
        mutate(function () {
          var board = activeBoard();
          var day = board.days.find(function (d) { return d.id === dayId; });
          if (day) day.slots.push({ id: uid('slot'), time: '', status: '', clientName: '', clientInfo: '', notes: '', lastDay: '' });
        });
      }
      if (action === 'toggle-day-color' && dayId) {
        mutate(function () {
          var board = activeBoard();
          var day = board.days.find(function (d) { return d.id === dayId; });
          if (day) day.color = day.color === 'maroon' ? 'blue' : 'maroon';
        });
      }
      if (action === 'rename-day' && dayId) {
        var boardR = activeBoard();
        var dayR = boardR && boardR.days.find(function (d) { return d.id === dayId; });
        if (dayR) {
          var newName = prompt('Day name', dayR.name);
          if (newName) mutate(function () { dayR.name = newName.trim(); });
        }
      }
      if (action === 'del-day' && dayId) {
        if (confirm('Delete this day and all its slots?')) {
          mutate(function () {
            var board = activeBoard();
            board.days = board.days.filter(function (d) { return d.id !== dayId; });
          });
        }
      }
      if (action === 'edit-client') openClientEditor(clientId);
      if (action === 'del-client' && clientId) {
        if (confirm('Delete this client?')) {
          mutate(function () {
            state.workspace.clients = state.workspace.clients.filter(function (c) { return c.id !== clientId; });
          });
        }
      }
      return;
    }

    if (e.target.closest('#js-side-add-client') || e.target.closest('#js-empty-add-client')) {
      openClientEditor(null);
      return;
    }
    if (e.target.closest('#js-seed-days')) {
      mutate(function () {
        var board = activeBoard();
        board.days = defaultBoard().days;
      });
    }
    if (e.target.closest('[data-open-client]')) {
      var row = e.target.closest('[data-open-client]');
      if (!e.target.closest('button, input, textarea, select, a, [data-copy], [data-client-field], [data-client-tasks]')) {
        openClientEditor(row.getAttribute('data-open-client'));
      }
    }
  });

  document.getElementById('js-add-board').addEventListener('click', function () {
    var name = prompt('Board name', 'New Schedule');
    if (!name) return;
    mutate(function () {
      var board = defaultBoard(name.trim());
      state.workspace.boards.push(board);
      state.activeBoardId = board.id;
      localStorage.setItem(BOARD_KEY, board.id);
    });
  });

  document.getElementById('js-rename-board').addEventListener('click', function () {
    var board = activeBoard();
    if (!board) return;
    var name = prompt('Rename board', board.name);
    if (!name) return;
    mutate(function () { board.name = name.trim(); });
  });

  document.getElementById('js-delete-board').addEventListener('click', function () {
    if (state.workspace.boards.length <= 1) {
      toast('Keep at least one board');
      return;
    }
    var board = activeBoard();
    if (!board || !confirm('Delete “‘ + board.name + ’”?')) return;
    mutate(function () {
      state.workspace.boards = state.workspace.boards.filter(function (b) { return b.id !== board.id; });
      state.activeBoardId = state.workspace.boards[0].id;
      localStorage.setItem(BOARD_KEY, state.activeBoardId);
    });
  });

  document.getElementById('js-add-slot').addEventListener('click', function () {
    var board = activeBoard();
    if (!board || !board.days.length) {
      toast('Add days to this board first');
      return;
    }
    var names = board.days.map(function (d, i) { return (i + 1) + '. ' + d.name; }).join('\n');
    var pick = prompt('Add slot to which day?\n' + names, '1');
    var idx = (parseInt(pick, 10) || 1) - 1;
    var day = board.days[idx];
    if (!day) return;
    mutate(function () {
      day.slots.push({ id: uid('slot'), time: '', status: '', clientName: '', clientInfo: '', notes: '', lastDay: '' });
    });
  });

  document.getElementById('js-add-day').addEventListener('click', function () {
    var board = activeBoard();
    if (!board) return;
    var name = prompt('Day name', 'Saturday');
    if (!name) return;
    mutate(function () {
      board.days.push({
        id: uid('day'),
        name: name.trim(),
        color: board.days.length % 2 ? 'maroon' : 'blue',
        slots: [{ id: uid('slot'), time: '', status: '', clientName: '', clientInfo: '', notes: '', lastDay: '' }]
      });
    });
  });

  document.getElementById('js-expand-cols').addEventListener('click', function () {
    state.collapsedCols = {};
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state.collapsedCols));

  function formatInformationCard(c) {

  function normalizeClient(raw) {
    raw = raw || {};
    var information = String(raw.information || raw.infoCard || raw['INFORMATION CARD'] || raw.info || '').trim();
    var base = {
      id: raw.id || uid('client'),
      name: String(raw.name || raw.client || raw.Client || raw.CLIENT || '').trim(),
      information: information,
      dob: String(raw.dob || raw.DOB || '').trim(),
      parents: String(raw.parents || raw.Parents || '').trim(),
      medicaid: String(raw.medicaid || raw.medicaidNumber || raw['Medicaid #'] || '').trim(),

      phone: String(raw.phone || raw.Phone || '').trim(),

      agency: String(raw.agency || raw.Agency || '').trim(),
      serviceCoordinator: String(raw.serviceCoordinator || raw.sc || raw['Service Coordinator'] || '').trim(),
      scEmail: String(raw.scEmail || raw.sc_email || raw['SC Email'] || '').trim(),
      tasks: String(raw.tasks || raw.Tasks || '').trim(),
      hours: String(raw.hours || raw.Hours || '').trim()
    };
    if (information) {
      var parsed = parseInfoCard(information);
      Object.keys(parsed).forEach(function (k) {
        if (parsed[k] && !base[k]) base[k] = parsed[k];

    if (!base.information) base.information = formatInformationCard(base);

  function normalizeSlot(raw) {
    raw = raw || {};
    var time = String(raw.time || raw.Time || raw['Appointment Time'] || '').trim();
    time = time.replace(/:(\d{2}):\d{2}\s*/i, ':$1 ').replace(/\s+/g, ' ').trim();
    var clientName = String(raw.clientName || raw['Client Name'] || raw.notes || raw.Notes || raw.client || '').trim();
    var clientInfo = String(raw.clientInfo || raw['Client Info'] || raw.information || raw.infoCard || '').trim();
    return {
      id: raw.id || uid('slot'),
      time: time,
      status: String(raw.status || raw.Status || '').trim(),
      clientName: clientName,

    };

  function normalizeWorkspace(ws) {
    if (!ws || typeof ws !== 'object') return ws;
    (ws.boards || []).forEach(function (b) {
      (b.days || []).forEach(function (d) {
        d.slots = (d.slots || []).map(function (s) {
          var slot = normalizeSlot(s);

  function setWorkspace(ws) {
