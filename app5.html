  function parseInfoCard(text) {
    var out = {};
    var src = String(text || '');
    function grab(label) {
      var re = new RegExp(label + '\\s*:\\s*([^\\n]+)', 'i');
      var m = src.match(re);
      return m ? m[1].trim() : '';
    }
    out.dob = grab('DOB');
    out.parents = grab('Parents?');
    out.medicaid = grab('Medicaid\\s*#?');
    out.email = grab('Email');
    out.phone = grab('Phone');
    out.sessions = grab('Sessions?');
    out.agency = grab('Agency');
    out.serviceCoordinator = grab('Service\\s*Coordinator');
    out.scEmail = grab('(?:SC\\s*Email|Service\\s*Coordinator\\s*Email)');
    out.tasks = grab('Tasks?(?:\\s*to\\s*be\\s*completed)?');
    return out;
  }

  function looksLikeDayName(value) {
    return /^(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(String(value || '').trim());
  }

  function dayColorForName(name) {
    return /tuesday|thursday|saturday/i.test(name || '') ? 'maroon' : 'blue';
  }

  function headerKey(h) {
    return String(h || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function mapHeader(h) {
    var k = headerKey(h);
    if (!k) return '';
    if (/appointment time|^time$/.test(k)) return 'time';
    if (/^status$/.test(k)) return 'status';
    if (/^client name$|client notes|^notes$/.test(k)) return 'clientName';
    if (/^client info$/.test(k)) return 'clientInfo';
    if (/information card|info card|^information$|details/.test(k)) return 'infoCard';
    if (/last day|end date|eos/.test(k)) return 'lastDay';
    // Caseload list headers (separate from schedule Client Name)
    if (/^clients?$|caseload/.test(k)) return 'name';
    if (/^name$/.test(k)) return 'name';
    if (/^dob$|date of birth|birthday/.test(k)) return 'dob';
    if (/parent/.test(k)) return 'parents';
    if (/medicaid/.test(k)) return 'medicaid';
    if (/^email$|client email/.test(k)) return 'email';
    if (/phone|mobile|cell/.test(k)) return 'phone';
    if (/session|regular spot|day time|current time/.test(k)) return 'sessions';
    if (/agency/.test(k)) return 'agency';
    if (/service coord| sc$|^sc /.test(k) && !/email/.test(k)) return 'serviceCoordinator';
    if (/sc email|coordinator email/.test(k)) return 'scEmail';
    if (/task/.test(k)) return 'tasks';
    if (/^hours$|duration|length|^hrs?$/.test(k)) return 'hours';
    if (/diagnos|dx code|^code$/.test(k)) return 'dx';
    return '';
  }

  function looksLikePersonName(value) {
    var s = String(value || '').trim();
    if (!s || s.length < 2 || s.length > 80) return false;
    if (looksLikeTime(s) || looksLikeStatus(s) || looksLikeDayName(s)) return false;
    if (/^(hold|lunch|makeup|open|full|not open|appointment|status|notes|last day|client|information)/i.test(s)) return false;
    if (/DOB\s*:|Email\s*:|Phone\s*:|Medicaid/i.test(s)) return false;
    if (/^\d+(\.\d+)?$/.test(s)) return false; // hours like 0.5
    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) return false;
    // Has at least one letter
    return /[A-Za-z]/.test(s);
  }

  function cleanNoteToClientName(notes) {
    var s = String(notes || '').trim();
    if (!s) return '';
    s = s.replace(/^HOLD\s*-?\s*/i, '').trim();
    // "Nancy 1/2 hour" → "Nancy"; "Xavier- in person" → "Xavier"
    s = s.split(/\s*[-–—]\s*/)[0].trim();
    s = s.replace(/\s+\d+\s*\/\s*\d+\s*(hour|hr|hours)?$/i, '').trim();
    s = s.replace(/\s+\d+(\.\d+)?\s*(hour|hr|hours)$/i, '').trim();
    return looksLikePersonName(s) ? s : '';
  }

  function parseDelimitedTable(text) {
    // Quote-aware parser so Google Sheets multiline cells (Information Card) stay intact
    var src = String(text || '').replace(/^\uFEFF/, '');
    if (!src.trim()) return [];
    var firstLine = src.split(/\r?\n/, 1)[0] || '';
    var delim = (firstLine.split('\t').length > firstLine.split(',').length) ? '\t' : ',';
    var rows = [];
    var row = [];
    var cur = '';
    var inQ = false;
    for (var i = 0; i < src.length; i++) {
      var ch = src[i];
      var next = src[i + 1];
      if (ch === '"') {
        if (inQ && next === '"') { cur += '"'; i++; }
        else inQ = !inQ;
        continue;
      }
      if (!inQ && ch === delim) {
        row.push(cur);
        cur = '';
        continue;
      }
      if (!inQ && (ch === '\n' || ch === '\r')) {
        if (ch === '\r' && next === '\n') i++;
        row.push(cur);
        rows.push(row);
        row = [];
        cur = '';
        continue;
      }
      cur += ch;
    }
    if (cur.length || row.length) {
      row.push(cur);
      rows.push(row);
    }
    return rows.filter(function (r) {
      return r.some(function (c) { return String(c || '').trim() !== ''; });
    });
  }

  function looksLikeTime(value) {
    var s = String(value || '').trim();
    if (!s) return false;
    if (/^\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM)?$/i.test(s)) return true;
    if (/^\d{1,2}\s*(AM|PM)$/i.test(s)) return true;
    // Excel sometimes yields locale time strings
    if (/^\d{1,2}:\d{2}(:\d{2})?\s*[AaPp]\.?[Mm]\.?$/.test(s)) return true;
    return false;
  }

  function looksLikeStatus(value) {
    var s = String(value || '').trim();
    if (!s) return false;
    return /^(full|open\b|lunch|makeup|not open|scheduling)/i.test(s) ||
      STATUS_OPTIONS.some(function (o) { return o.value && o.value.toLowerCase() === s.toLowerCase(); });
  }

  function cell(rows, r, c) {
    return String((rows[r] && rows[r][c] != null) ? rows[r][c] : '').trim();
  }

  function maxCols(rows) {
    var m = 0;
    (rows || []).forEach(function (row) { m = Math.max(m, (row || []).length); });
    return m;
  }

  function importClientsFromRows(rows, result) {
    // Emme layouts:
    // 1) CLIENT | INFORMATION CARD | TASKS
    // 2) CLIENT | Wednesday 6:30 | 0.5   (no Name column, no info card)
    // 3) No headers — col A person + col B DOB:/Email: block
    var nameCol = -1, infoCol = -1, taskCol = -1, sessionsCol = -1, hoursCol = -1;
    var startRow = 0;

    for (var r = 0; r < Math.min(rows.length, 50); r++) {
      var row = rows[r] || [];
      for (var c = 0; c < row.length; c++) {
        var mapped = mapHeader(row[c]);
        if (mapped === 'name') nameCol = c;
        if (mapped === 'infoCard') infoCol = c;
        if (mapped === 'tasks') taskCol = c;
        if (mapped === 'sessions') sessionsCol = c;
        if (mapped === 'hours') hoursCol = c;
      }
      if (nameCol >= 0 || infoCol >= 0) {
        startRow = r + 1;
        // If CLIENT header found but sessions/hours headers missing, use next columns
        if (nameCol >= 0 && sessionsCol < 0 && cell(rows, r, nameCol + 1) && !mapHeader(cell(rows, r, nameCol + 1))) {
          // header row may only say CLIENT; data rows have day/time beside name
        }
        break;
      }
    }

    // Fallback: Emme Caseload — person in A, info card in B
    if (nameCol < 0 && infoCol < 0) {
      for (var r2 = 0; r2 < Math.min(rows.length, 120); r2++) {
        var a = cell(rows, r2, 0);
        var b = cell(rows, r2, 1);
        if (looksLikePersonName(a) && b && /DOB\s*:|Email\s*:|Phone\s*:|Medicaid|Parents\s*:/i.test(b)) {
          nameCol = 0;
          infoCol = 1;
          taskCol = 2;
          startRow = r2;
          break;
        }
      }
    }

    // Fallback: CLIENT list only (schedule sheet right side) — names in a column near "CLIENT" label
    if (nameCol < 0) {
      for (var r3 = 0; r3 < Math.min(rows.length, 40); r3++) {
        for (var c3 = 0; c3 < maxCols(rows); c3++) {
          if (/^clients?$/i.test(cell(rows, r3, c3))) {
            nameCol = c3;
            startRow = r3 + 1;
            break;
          }
        }
        if (nameCol >= 0) break;
      }
    }

    function addClient( partial ) {
      var client = normalizeClient(partial);
      if (!client.name || client.name.length > 120) return;
      if (/^clients?$/i.test(client.name)) return;
      result.clients.push(client);
    }

    if (nameCol >= 0 || infoCol >= 0) {
      for (var i = startRow; i < rows.length; i++) {
        var name = nameCol >= 0 ? cell(rows, i, nameCol) : '';
        var info = infoCol >= 0 ? cell(rows, i, infoCol) : '';
        if (!name && !info) continue;
        if (looksLikeDayName(name) || /^clients?$/i.test(name)) continue;
        if (/^information card$/i.test(info)) continue;
        if (looksLikeTime(name) || looksLikeStatus(name)) continue;
        // Stop if we hit a diagnostic code block
        if (/^F\d{2}/i.test(name)) break;

        var fromCard = info ? parseInfoCard(info) : {};
        var sessions = sessionsCol >= 0 ? cell(rows, i, sessionsCol) : (fromCard.sessions || '');
        var hours = hoursCol >= 0 ? cell(rows, i, hoursCol) : '';

        // CLIENT | Wednesday 6:30 | 0.5  (no dedicated session/hours headers)
        if (!sessions && nameCol >= 0) {
          var beside = cell(rows, i, nameCol + 1);
          if (beside && !/DOB\s*:/i.test(beside) && !looksLikeTime(beside) && !/^\d+(\.\d+)?$/.test(beside)) {
            sessions = beside;
          }
          var hoursBeside = cell(rows, i, nameCol + 2);
          if (!hours && /^\d+(\.\d+)?$/.test(hoursBeside)) hours = hoursBeside;
          // Sometimes hours is in col+1 if sessions missing
          if (!hours && /^\d+(\.\d+)?$/.test(beside)) {
            hours = beside;
            sessions = fromCard.sessions || '';
          }
        }

        // Info-card-only row: derive name from card first line if needed
        if (!name && info) {
          name = info.split(/\n/)[0].replace(/^(CLIENT|NAME)\s*:?\s*/i, '').trim();
          if (/DOB\s*:/i.test(name)) name = '';
        }

        if (!name && !fromCard.email && !fromCard.phone) continue;
        if (name && !looksLikePersonName(name) && !fromCard.email) continue;

        addClient(Object.assign({}, fromCard, {
          name: name,
          information: info || '',
          tasks: taskCol >= 0 ? cell(rows, i, taskCol) : (fromCard.tasks || ''),
          sessions: sessions,
          hours: hours
        }));
      }
    } else {
      // Last resort: any info-card-looking cell
      rows.forEach(function (row, ri) {
        (row || []).forEach(function (raw, ci) {
          var t = String(raw || '').trim();
          if (t.length > 25 && /DOB\s*:|Email\s*:|Phone\s*:/i.test(t)) {
            var card = parseInfoCard(t);
            var nm = cell(rows, ri, ci - 1);
            if (!looksLikePersonName(nm)) nm = '';
            if (!nm) {
              nm = t.split(/\n/)[0].replace(/^(CLIENT|NAME)\s*:?\s*/i, '').trim();
              if (/DOB\s*:/i.test(nm)) nm = '';
            }
            if (nm) addClient(Object.assign({ name: nm, information: t }, card));
          }
        });
      });
    }
  }

  function harvestClientsFromScheduleNotes(result) {
    var existing = {};
    (result.clients || []).forEach(function (c) {
      if (c.name) existing[c.name.toLowerCase()] = true;
    });
    (result.boards || []).forEach(function (board) {
      (board.days || []).forEach(function (day) {
        (day.slots || []).forEach(function (slot) {
          var nm = cleanNoteToClientName(slot.notes);
          if (!nm) return;
          var key = nm.toLowerCase();
          if (existing[key]) return;
          existing[key] = true;
          result.clients.push(normalizeClient({
            name: nm,
            sessions: day.name + (slot.time ? (' ' + slot.time) : '')
          }));
        });
      });
    });
  }

  function importScheduleFromRows(rows, result, boardName) {
    var board = { id: uid('board'), name: boardName || result.sourceLabel || 'Imported Schedule', days: [] };
    var currentDay = null;
    var cols = maxCols(rows);

    function ensureDay(name) {
      var clean = String(name || '').replace(/:$/, '').trim();
      if (!clean) return null;
      // Prefer bare day name
      var m = clean.match(/^(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
      if (m) clean = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
      var existing = board.days.find(function (d) { return d.name.toLowerCase() === clean.toLowerCase(); });
      if (existing) { currentDay = existing; return existing; }
      currentDay = { id: uid('day'), name: clean, color: dayColorForName(clean), slots: [] };
      board.days.push(currentDay);
      return currentDay;
    }

    // Walk every row; day headers can appear in any column (merged cells / side tables)
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r] || [];

      // Day header row?
      for (var c = 0; c < row.length; c++) {
        var v = String(row[c] || '').trim();
        if (looksLikeDayName(v) && !looksLikeTime(v)) {
          ensureDay(v);
        }
      }

      // Find a time cell in this row and read status/notes/lastDay to its right
      for (var c2 = 0; c2 < row.length; c2++) {
        var t = String(row[c2] || '').trim();
        if (!looksLikeTime(t)) continue;
        if (!currentDay) ensureDay('Imported');
        var status = '';
        var clientName = '';
        var clientInfo = '';
        var lastDay = '';
        for (var k = c2 + 1; k < Math.min(row.length, c2 + 7); k++) {
          var val = String(row[k] || '').trim();
          if (!val) continue;
          if (!status && looksLikeStatus(val)) { status = val; continue; }
          if (!clientName && !looksLikeTime(val) && !looksLikeStatus(val) && !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(val) && !/DOB\s*:/i.test(val)) {
            clientName = val;
            continue;
          }
          if (!clientInfo && /DOB\s*:|Email\s*:|Phone\s*:|Parents\s*:/i.test(val)) {
            clientInfo = val;
            continue;
          }
          if (!lastDay && (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(val) || /end of summer|eos|last day/i.test(val))) {
            lastDay = val;
          }
        }
        if (!status && row[c2 + 1]) status = String(row[c2 + 1] || '').trim();
        if (!clientName && row[c2 + 2]) clientName = String(row[c2 + 2] || '').trim();
        // 4-col legacy: time|status|name|lastDay  OR 5-col: time|status|name|info|lastDay
        var c3 = String(row[c2 + 3] || '').trim();
        var c4 = String(row[c2 + 4] || '').trim();
        if (!clientInfo && c3 && /DOB\s*:|Email\s*:|Phone\s*:/i.test(c3)) clientInfo = c3;
        else if (!lastDay && c3 && (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(c3) || /end of summer/i.test(c3))) lastDay = c3;
        else if (!clientInfo && c3 && !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(c3)) clientInfo = c3;
        if (!lastDay && c4) lastDay = c4;
        if (/^(appointment\s*time|time|status|notes|client name|client info|last\s*day)$/i.test(t)) continue;
        currentDay.slots.push(normalizeSlot({
          time: t,
          status: status,
          clientName: clientName,
          clientInfo: clientInfo,
          lastDay: lastDay
        }));
        break;
      }
    }

    if (!board.days.length) {
      for (var r3 = 0; r3 < rows.length; r3++) {
        var first = cell(rows, r3, 0);
        if (looksLikeDayName(first)) { ensureDay(first); continue; }
        if (looksLikeTime(first)) {
          if (!currentDay) ensureDay('Imported');
          var maybeInfo = cell(rows, r3, 3);
          var maybeLast = cell(rows, r3, 4);
          if (!maybeLast && /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(maybeInfo)) {
            maybeLast = maybeInfo;
            maybeInfo = '';
          }
          currentDay.slots.push(normalizeSlot({
            time: first,
            status: cell(rows, r3, 1),
            clientName: cell(rows, r3, 2),
            clientInfo: maybeInfo,
            lastDay: maybeLast
          }));
        }
      }
    }

    // Attach client info from caseload clients when name matches and info empty
    if (result.clients && result.clients.length) {
      board.days.forEach(function (day) {
        (day.slots || []).forEach(function (slot) {
          if (slot.clientInfo) return;
          var nm = (slot.clientName || '').toLowerCase();
          if (!nm) return;
          var match = result.clients.find(function (c) { return c.name && c.name.toLowerCase() === nm; });
          if (match) slot.clientInfo = formatInformationCard(match);
        });
      });
    }

    if (board.days.some(function (d) { return d.slots.length; })) {
      result.boards.push(board);
    }
    return board;
  }

  function importDxFromRows(rows, result) {
    rows.forEach(function (row) {
      (row || []).forEach(function (raw) {
        var t = String(raw || '').trim();
        if (/^F\d{2}/i.test(t) && t.length < 120) result.dxCodes.push(t);
      });
    });
  }

  function importFromGrid(rows, sourceLabel) {
    var result = emptyImport();
    result.sourceLabel = sourceLabel || 'spreadsheet';
    if (!rows || !rows.length) {
      result.notes.push('Sheet was empty.');
      return result;
    }

    importClientsFromRows(rows, result);
    importScheduleFromRows(rows, result, sourceLabel);
    harvestClientsFromScheduleNotes(result);
    importDxFromRows(rows, result);

    // Deduplicate clients by name
    var seen = {};
    result.clients = result.clients.filter(function (c) {
      var key = (c.name || '').toLowerCase();
      if (!key || seen[key]) return false;
      seen[key] = true;
      return true;
    });

    var slotCount = result.boards.reduce(function (n, b) {
      return n + b.days.reduce(function (m, d) { return m + d.slots.length; }, 0);
    }, 0);
    result.notes.push(
      'Rows: ' + rows.length +
      ' · clients: ' + result.clients.length +
      ' · slots: ' + slotCount +
      ' · cols: ' + maxCols(rows)
    );
    return result;
  }

  function waitForXlsx(timeoutMs) {
    return new Promise(function (resolve, reject) {
      if (typeof XLSX !== 'undefined') { resolve(XLSX); return; }
      var start = Date.now();
      var t = setInterval(function () {
        if (typeof XLSX !== 'undefined') {
          clearInterval(t);
          resolve(XLSX);
        } else if (Date.now() - start > (timeoutMs || 8000)) {
          clearInterval(t);
          reject(new Error('Excel reader failed to load. Check your network, then hard-refresh (Ctrl+F5).'));
        }
      }, 150);
    });
  }

  function importFromWorkspaceJson(parsed, sourceLabel) {
    var result = emptyImport();
    result.sourceLabel = sourceLabel || 'JSON';
    if (!parsed || typeof parsed !== 'object') return result;

    // Full Emme backup — keep structure/ids intact when present
    if (Array.isArray(parsed.boards)) {
      result.fullBackup = true;
      result.boards = parsed.boards.map(function (b) {
        return {
          id: b.id || uid('board'),
          name: b.name || 'Imported',
          days: (b.days || []).map(function (d) {
            return {
              id: d.id || uid('day'),
              name: d.name || 'Day',
              color: d.color === 'maroon' ? 'maroon' : 'blue',
              slots: (d.slots || []).map(function (s) {
                var slot = normalizeSlot(s);
                if (s && s.id) slot.id = s.id;
                return slot;
              })
            };
          })
        };
      });
    }
    if (Array.isArray(parsed.clients)) {
      result.clients = parsed.clients.map(function (c) {
        var client = normalizeClient(c);
        if (c && c.id) client.id = c.id;
        return client;
      }).filter(function (c) { return c.name; });
    }
    if (Array.isArray(parsed.dxCodes)) result.dxCodes = parsed.dxCodes.map(String);
    // Loose arrays of clients
    if (!result.clients.length && Array.isArray(parsed) && parsed[0] && (parsed[0].name || parsed[0].email)) {
      result.clients = parsed.map(normalizeClient).filter(function (c) { return c.name; });
    }
    result.notes.push(
      'JSON: ' + result.clients.length + ' client(s), ' +
      result.boards.length + ' board(s)' +
      (result.fullBackup ? ' (Emme backup)' : '')
    );
    return result;
  }

  function restoreFullWorkspace(parsed) {
    if (!parsed || typeof parsed !== 'object') throw new Error('Invalid backup file');
    if (!Array.isArray(parsed.boards) || !parsed.boards.length) {
      throw new Error('That JSON is not an Emme schedule backup (no boards found).');
    }
    var boards = parsed.boards.map(function (b) {
      return {
        id: b.id || uid('board'),
        name: String(b.name || 'Schedule'),
        days: Array.isArray(b.days) ? b.days.map(function (d) {
          return {
            id: d.id || uid('day'),
            name: String(d.name || 'Day'),
            color: d.color === 'maroon' ? 'maroon' : 'blue',
            slots: Array.isArray(d.slots) ? d.slots.map(function (s) {
              var slot = normalizeSlot(s);
              if (s && s.id) slot.id = s.id;
              return slot;
            }) : []
          };
        }) : []
      };
    });
    var clients = Array.isArray(parsed.clients) ? parsed.clients.map(function (c) {
      var client = normalizeClient(c);
      if (c && c.id) client.id = c.id;
      return client;
    }).filter(function (c) { return c.name; }) : [];

    setWorkspace({
      version: Number(parsed.version) || 1,
      updatedAt: new Date().toISOString(),
      boards: boards,
      clients: clients,
      dxCodes: Array.isArray(parsed.dxCodes) && parsed.dxCodes.length ? parsed.dxCodes.map(String) : DEFAULT_DX.slice()
    });
    state.activeBoardId = state.workspace.boards[0].id;
    localStorage.setItem(BOARD_KEY, state.activeBoardId);
    saveLocal(state.workspace);
    renderAll();
    scheduleSave();
  }

  async function smartImportFiles(fileList, options) {
    options = options || {};
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) throw new Error('No file selected');
    var file = files[0];
    var ext = fileExt(file.name);

    // Emme JSON backup → exact restore
    if (ext === 'json' || /json/i.test(file.type) || /\.json$/i.test(file.name)) {
      var text = (await readAsText(file)).replace(/^\uFEFF/, '');
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (_) {
        throw new Error('That file is not valid JSON.');
      }
      if (parsed && Array.isArray(parsed.boards) && parsed.boards.length) {
        restoreFullWorkspace(parsed);
        return {
          mode: 'backup',
          message: 'Imported Emme backup (' + parsed.boards.length + ' board(s), ' +
            ((parsed.clients && parsed.clients.length) || 0) + ' client(s))'
        };
      }
    }

    // Spreadsheet / other → parse then apply
    var combined = emptyImport();
    combined.sourceLabel = files.map(function (f) { return f.name; }).join(', ');
    for (var i = 0; i < files.length; i++) {
      var part = await parseUploadFile(files[i]);
      combined.clients = combined.clients.concat(part.clients || []);
      combined.boards = combined.boards.concat(part.boards || []);
      combined.dxCodes = combined.dxCodes.concat(part.dxCodes || []);
      combined.notes = combined.notes.concat(part.notes || []);
      if (part.fullBackup) combined.fullBackup = true;
    }
    var seen = {};
    combined.clients = combined.clients.filter(function (c) {
      var key = (c.name || '').toLowerCase();
      if (!key || seen[key]) return false;
      seen[key] = true;
      return true;
    });
    if (!combined.clients.length && !combined.boards.length && !combined.dxCodes.length) {
      throw new Error('No clients or schedule slots found in “' + file.name + '”.');
    }

    if (options.previewOnly) {
      pendingUpload = combined;
      return { mode: 'preview', payload: combined };
    }

    var applyMode = options.mode || (combined.fullBackup ? 'replace' : 'merge');
    applyUpload(combined, applyMode);
    var slots = combined.boards.reduce(function (n, b) {
      return n + (b.days || []).reduce(function (m, d) { return m + (d.slots || []).length; }, 0);
    }, 0);
    return {
      mode: applyMode,
      message: 'Imported ' + combined.clients.length + ' client(s) and ' + slots + ' slot(s) from ' + file.name
    };
  }

  function extractJsonBlock(text) {
    var raw = String(text || '').trim();
    var fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) raw = fence[1].trim();
    var start = raw.indexOf('{');
    var end = raw.lastIndexOf('}');
    if (start >= 0 && end > start) raw = raw.slice(start, end + 1);
    return JSON.parse(raw);
  }

  async function refreshOrgAI() {
    try {
      var res = await fetch('/api/openai-chat', { method: 'GET', credentials: 'include' });
      var data = await res.json().catch(function () { return {}; });
      orgAI = {
        checked: true,
        configured: !!data.configured,
        model: data.model || '',
        provider: data.provider || 'none'
      };
    } catch (_) {
      orgAI = { checked: true, configured: false, model: '', provider: 'none' };
    }
    return orgAI;
  }

  async function callScheduleAI(messages) {
    if (!orgAI.checked) await refreshOrgAI();
    if (!orgAI.configured) throw new Error('Org AI is not configured. CSV/Excel/JSON still work without AI.');
    var res = await fetch('/api/openai-chat', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, model: orgAI.model })
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || ('AI error ' + res.status));
    if (!data.content) throw new Error('AI returned an empty response');
    return data.content;
  }

  var AI_SYSTEM = [
    'You extract Emme therapy schedule and caseload data from uploaded files.',
    'Return ONLY valid JSON with this shape:',
    '{ "clients":[{"name","dob","parents","medicaid","email","phone","sessions","agency","serviceCoordinator","scEmail","tasks","hours"}],',

    'Use empty arrays when unknown. Preserve emails/phones exactly. Status values like Full, Open 4x, Lunch, Makeup, Not Open when present.',

  ].join(' ');

  async function aiImportFromText(text, sourceLabel) {

    ]);
    var parsed = extractJsonBlock(content);

  async function aiImportFromMultimodal(userContent, sourceLabel) {

      { role: 'system', content: AI_SYSTEM },
      { role: 'user', content: userContent }
    ]);
    var parsed = extractJsonBlock(content);

    return result;

  async function parseUploadFile(file) {
    if (file.size > UPLOAD_MAX_BYTES) throw new Error('File is too large (max 12 MB)');
    var ext = fileExt(file.name);
    var label = file.name;

    // JSON workspace / client list
    if (ext === 'json' || /json/i.test(file.type)) {
      var jsonText = await readAsText(file);
      var parsed = JSON.parse(jsonText);
      if (parsed && (parsed.boards || parsed.clients || Array.isArray(parsed))) {
        return importFromWorkspaceJson(parsed, label);
      }
      return aiImportFromText(jsonText, label);
    }

    // CSV / TSV / TXT
    if (ext === 'csv' || ext === 'tsv' || ext === 'txt' || /csv|tab-separated|plain/i.test(file.type)) {
      var text = await readAsText(file);
      var grid = parseDelimitedTable(text);
      var fromGrid = importFromGrid(grid, label);
      if (fromGrid.clients.length || fromGrid.boards.length || fromGrid.dxCodes.length) return fromGrid;
      try {
        return await aiImportFromText(text, label);
      } catch (aiErr) {
        throw new Error(
          'Could not map that spreadsheet. Tip: download as Excel (.xlsx) or CSV from Google Sheets. ' +
          (aiErr && aiErr.message ? aiErr.message : '')
        );
      }
    }

    // Excel
    if (ext === 'xlsx' || ext === 'xls' || /spreadsheet|excel/i.test(file.type)) {
      var XLSXlib = await waitForXlsx(10000);
      var buf = await readAsArrayBuffer(file);
      var wb = XLSXlib.read(buf, { type: 'array', cellDates: false, raw: false });
      var merged = emptyImport();
      merged.sourceLabel = label;
      var diagnostics = [];
      wb.SheetNames.forEach(function (sheetName) {
        var sheet = wb.Sheets[sheetName];
        var rows = XLSXlib.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '', blankrows: false });
        // Normalize all cells to strings (SheetJS may leave numbers)
        rows = rows.map(function (row) {
          return (row || []).map(function (v) { return v == null ? '' : String(v); });
        });
        diagnostics.push(sheetName + ':' + rows.length + 'r');
        var part = importFromGrid(rows, sheetName);
        merged.clients = merged.clients.concat(part.clients);
        part.boards.forEach(function (b) {
          if (!b.name || b.name === 'Imported Schedule') b.name = sheetName;
          merged.boards.push(b);
        });
        merged.dxCodes = merged.dxCodes.concat(part.dxCodes);
        merged.notes = merged.notes.concat(part.notes || []);
      });
      // Dedupe clients across sheets
      var seenX = {};
      merged.clients = merged.clients.filter(function (c) {
        var key = (c.name || '').toLowerCase();
        if (!key || seenX[key]) return false;
        seenX[key] = true;
        return true;
      });
      if (merged.clients.length || merged.boards.length || merged.dxCodes.length) {
        merged.notes.push('Excel sheets: ' + diagnostics.join(', '));
        return merged;
      }
      // Last resort: flatten to CSV text and try AI
      var flat = wb.SheetNames.map(function (n) {
        return '--- ' + n + ' ---\n' + XLSXlib.utils.sheet_to_csv(wb.Sheets[n]);
      }).join('\n\n');
      try {
        return await aiImportFromText(flat, label);
      } catch (aiErr) {
        throw new Error(
          'Excel opened (' + diagnostics.join(', ') + ') but no clients/slots were detected. ' +
          'Make sure the sheet has client names or times like 4:30 PM. ' +
          (aiErr && aiErr.message ? aiErr.message : '')
        );
      }
    }

    // DOCX
    if (ext === 'docx' || /wordprocessingml/i.test(file.type)) {
      if (typeof mammoth === 'undefined') throw new Error('Word reader failed to load');
      var docBuf = await readAsArrayBuffer(file);
      var doc = await mammoth.extractRawText({ arrayBuffer: docBuf });
      var docText = String(doc.value || '').trim();
      if (!docText) throw new Error('No text found in Word file');
      return aiImportFromText(docText, label);
    }
    if (ext === 'doc') throw new Error('Legacy .doc is not supported. Re-save as .docx, CSV, or Excel.');

    // Images
    if (['jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(ext) >= 0 || /^image\//i.test(file.type)) {
      var dataUrl = await readAsDataURL(file);
      var mediaType = (/^image\//.test(file.type) ? file.type : null) || (ext === 'png' ? 'image/png' : 'image/jpeg');
      return aiImportFromMultimodal([
        { type: 'text', text: 'Uploaded image: ' + label + '\nExtract all clients, schedule slots, statuses, and contact fields into the JSON schema.' },
        { type: 'image', source: { type: 'base64', media_type: mediaType, data: dataUrlToBase64(dataUrl) } }
      ], label);
    }

    // PDF
    if (ext === 'pdf' || file.type === 'application/pdf') {
      var pdfUrl = await readAsDataURL(file);
      return aiImportFromMultimodal([
        { type: 'text', text: 'Uploaded PDF: ' + label + '\nExtract caseload and schedule into the JSON schema.' },
        { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: dataUrlToBase64(pdfUrl) } }
      ], label);
    }

    // Fallback: try text, then AI
    try {
      var fallbackText = await readAsText(file);
      if (fallbackText && fallbackText.replace(/\s/g, '').length > 20) {
        var grid2 = parseDelimitedTable(fallbackText);
        var g2 = importFromGrid(grid2, label);
        if (g2.clients.length || g2.boards.length) return g2;
        return aiImportFromText(fallbackText, label);
      }
    } catch (_) {}

    throw new Error('Could not read this file type automatically. Try CSV, Excel, JSON, PDF, image, or DOCX.');
  }

  function mergeClients(existing, incoming) {
    var out = existing.slice();
    incoming.forEach(function (c) {
      if (!c.name) return;
      var idx = out.findIndex(function (x) {
        return x.name.toLowerCase() === c.name.toLowerCase() ||
          (c.email && x.email && x.email.toLowerCase() === c.email.toLowerCase());
      });
      if (idx >= 0) {
        var prev = out[idx];
        out[idx] = Object.assign({}, prev, {
          information: c.information || prev.information,
          dob: c.dob || prev.dob,
          parents: c.parents || prev.parents,
          medicaid: c.medicaid || prev.medicaid,
          email: c.email || prev.email,
          phone: c.phone || prev.phone,
          sessions: c.sessions || prev.sessions,
          agency: c.agency || prev.agency,
          serviceCoordinator: c.serviceCoordinator || prev.serviceCoordinator,
          scEmail: c.scEmail || prev.scEmail,
          tasks: c.tasks || prev.tasks,
          hours: c.hours || prev.hours
        });
      } else {
        out.push(c);
      }
    });
    return out;
  }

  function applyUpload(payload, mode) {
    // Emme JSON backups always fully restore (same as Import)
    if (payload && payload.fullBackup && mode === 'replace') {
      restoreFullWorkspace({
        version: 1,
        boards: payload.boards,
        clients: payload.clients,
        dxCodes: payload.dxCodes
      });
      return;
    }
    mutate(function () {
      if (mode === 'replace') {
        if (payload.boards.length) state.workspace.boards = payload.boards;
        if (payload.clients.length) state.workspace.clients = payload.clients;
        if (payload.dxCodes.length) state.workspace.dxCodes = payload.dxCodes.slice();
      } else {
        if (payload.clients.length) {
          state.workspace.clients = mergeClients(state.workspace.clients || [], payload.clients);
        }
        if (payload.boards.length) {
          payload.boards.forEach(function (b) {
            var existing = state.workspace.boards.find(function (x) {
              return x.name.toLowerCase() === String(b.name || '').toLowerCase();
            });
            if (!existing) {
              state.workspace.boards.push(b);
            } else {
              (b.days || []).forEach(function (day) {
                var ed = existing.days.find(function (d) { return d.name.toLowerCase() === day.name.toLowerCase(); });
                if (!ed) existing.days.push(day);
                else {
                  day.slots.forEach(function (slot) {
                    var match = ed.slots.find(function (s) {
                      return s.time === slot.time &&
                        (slotClientName(s) === slotClientName(slot) || s.notes === slot.notes);
                    });
                    if (!match) ed.slots.push(normalizeSlot(slot));
                    else {
                      if (slot.status) match.status = slot.status;
                      if (slot.lastDay) match.lastDay = slot.lastDay;
                      if (slot.clientName || slot.notes) {
                        match.clientName = slot.clientName || slot.notes;
                        match.notes = match.clientName;
                      }
                      if (slot.clientInfo) match.clientInfo = slot.clientInfo;
                    }
                  });
                }
              });
            }
          });
        }
        if (payload.dxCodes.length) {
          var set = {};
          (state.workspace.dxCodes || []).concat(payload.dxCodes).forEach(function (c) { set[c] = true; });
          state.workspace.dxCodes = Object.keys(set);
        }
      }
      normalizeWorkspace(state.workspace);
      syncAllClientsToSchedule({ force: false });
      if (state.workspace.boards[0]) {
        state.activeBoardId = state.workspace.boards[0].id;
        localStorage.setItem(BOARD_KEY, state.activeBoardId);
      }
    });
  }

      'upload-apply',
      null
    );
    var drop = document.getElementById('js-upload-drop');
    drop.addEventListener('click', function () {
      pickFiles(true).then(function (files) {
        if (files.length) handleUploadFiles(files);
      });
    });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('upload-drop--active'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('upload-drop--active'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('upload-drop--active');
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) handleUploadFiles(files);
    });
  }

  function renderUploadPreview(payload) {
    var el = document.getElementById('js-upload-preview');
    var status = document.getElementById('js-upload-status');
    if (!el || !status) return;
    status.innerHTML = '';
    el.classList.remove('is-hidden');
    var slotCount = (payload.boards || []).reduce(function (n, b) {
      return n + (b.days || []).reduce(function (m, d) { return m + (d.slots || []).length; }, 0);
    }, 0);
    var clientNames = (payload.clients || []).slice(0, 8).map(function (c) { return '<li>' + escapeHtml(c.name) + (c.email ? ' · ' + escapeHtml(c.email) : '') + '</li>'; }).join('');
    el.innerHTML =
      '<strong>' + escapeHtml(payload.sourceLabel || 'Upload') + '</strong>' +
      '<div style="margin-top:0.35rem">' +
        (payload.clients.length) + ' client(s) · ' +
        (payload.boards.length) + ' board(s) · ' +
        slotCount + ' slot(s)' +
        (payload.dxCodes.length ? ' · ' + payload.dxCodes.length + ' DX code(s)' : '') +
      '</div>' +
      (clientNames ? '<ul>' + clientNames + ((payload.clients.length > 8) ? '<li>…</li>' : '') + '</ul>' : '') +
      ((payload.notes || []).length ? '<p style="margin-top:0.4rem;color:var(--muted)">' + escapeHtml(payload.notes.join(' ')) + '</p>' : '');
  }

  async function handleUploadFiles(fileList) {
    var status = document.getElementById('js-upload-status');
    if (status) status.innerHTML = '<div class="upload-busy"><span class="spin" aria-hidden="true"></span> Reading file…</div>';
    pendingUpload = null;
    try {
      var result = await smartImportFiles(fileList, { previewOnly: true });
      if (result.mode === 'backup') {
        if (status) status.innerHTML = '';
        closeModal();
        toast(result.message);
        return;
      }
      renderUploadPreview(result.payload);
      if (result.payload.fullBackup) {
        var replaceRadio = document.querySelector('input[name="upload-mode"][value="replace"]');
        if (replaceRadio) replaceRadio.checked = true;
      }
      toast('Ready to apply');
    } catch (err) {
      pendingUpload = null;
      console.error(err);
      if (status) status.innerHTML = '<p style="color:#8b2e3a;font-weight:600;margin-top:0.75rem">' + escapeHtml(err.message || 'Upload failed') + '</p>';
      toast(err.message || 'Upload failed');
    }
  }

  function clearFileAccept(input) {
    if (!input) return;
    input.removeAttribute('accept');
    try { input.accept = ''; } catch (_) {}
  }

  function pickFiles(multiple) {
    return new Promise(function (resolve) {
      var permanent = document.getElementById('js-import-file');
      if (permanent && !permanent._emmeBusy) {
        permanent._emmeBusy = true;
        permanent.value = '';
        permanent.multiple = !!multiple;
        clearFileAccept(permanent);
        var onChange = function () {
          permanent.removeEventListener('change', onChange);
          permanent.removeEventListener('cancel', onCancel);
          permanent._emmeBusy = false;
          resolve(Array.prototype.slice.call(permanent.files || []));
        };
        var onCancel = function () {
          permanent.removeEventListener('change', onChange);
          permanent.removeEventListener('cancel', onCancel);
          permanent._emmeBusy = false;
          resolve([]);
        };
        permanent.addEventListener('change', onChange);
        permanent.addEventListener('cancel', onCancel);
        permanent.click();
        return;
      }

      var input = document.createElement('input');
      input.type = 'file';
      clearFileAccept(input);
      if (multiple) input.multiple = true;
      input.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px;';
      document.body.appendChild(input);
      var done = false;
      function finish(files) {
        if (done) return;
        done = true;
        try { input.remove(); } catch (_) {}
        resolve(files || []);
      }
      input.addEventListener('change', function () {
        finish(Array.prototype.slice.call(input.files || []));
      });
      input.addEventListener('cancel', function () { finish([]); });
      input.click();
    });
  }

  document.getElementById('js-import').addEventListener('click', function () {
    var input = document.getElementById('js-import-file');
    if (!input) {
      pickFiles(true).then(function (files) {
        if (!files.length) return;
        toast('Importing…');
        return smartImportFiles(files, { mode: 'merge' }).then(function (result) {
          toast(result.message || 'Imported');
          renderAll();
        });
      }).catch(function (err) {
        console.error(err);
        toast(err.message || 'Import failed');
      });
      return;
    }
    input.value = '';
    clearFileAccept(input);
    input.onchange = function () {
      var files = Array.prototype.slice.call(input.files || []);
      input.onchange = null;
      if (!files.length) return;
      toast('Importing…');
      smartImportFiles(files, { mode: 'merge' }).then(function (result) {
        toast(result.message || 'Imported');
        renderAll();
      }).catch(function (err) {
        console.error(err);
        toast(err.message || 'Import failed');
      });
    };
    input.click();
  });

  document.getElementById('js-upload').addEventListener('click', function () {
    openUploadModal();
  });

  // Remove old static picker wiring if present
  if (bc) {
    bc.onmessage = function (ev) {
      if (!ev.data || ev.data.type !== 'workspace') return;
      if (state.dirty || state.saving) return;
      var local = loadLocal();
      if (local && local.updatedAt === ev.data.updatedAt) {
        setWorkspace(local);
        renderAll();
      }
    };
  }

  async function init() {
    setSyncLabel('Connecting…', 'local');
    refreshOrgAI();
    var local = loadLocal();
    try {
      var cloud = await loadCloud();
      if (cloud.configured) {
        state.cloudConfigured = true;
        if (cloud.workspace && (cloud.workspace.boards || []).length) {
          setWorkspace(cloud.workspace);
        } else if (local && (local.boards || []).length) {
          setWorkspace(local);
          await persist();
        } else {
          setWorkspace(seedWorkspace());
          await persist();
        }
        state.lastRemoteUpdatedAt = state.workspace.updatedAt;
        saveLocal(state.workspace);
        setSyncLabel('Live sync on', 'live');
        state.pollTimer = setInterval(pollMeta, POLL_MS);
      } else {
        state.cloudConfigured = false;
        setWorkspace((local && local.boards && local.boards.length) ? local : seedWorkspace());
        saveLocal(state.workspace);
        setSyncLabel('Saved on this device', 'local');
      }
    } catch (_) {
      state.cloudConfigured = false;
      setWorkspace((local && local.boards && local.boards.length) ? local : seedWorkspace());
      saveLocal(state.workspace);
      setSyncLabel('Saved on this device', 'local');
    }

    if (!state.activeBoardId || !state.workspace.boards.some(function (b) { return b.id === state.activeBoardId; })) {
      state.activeBoardId = state.workspace.boards[0].id;
      localStorage.setItem(BOARD_KEY, state.activeBoardId);
    }
    syncAllClientsToSchedule({ force: false });
    renderAll();
  }

  init();
})();
  </script>
</body>
</html>
