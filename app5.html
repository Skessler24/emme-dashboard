<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Emme Schedule & Caseload — live weekly schedules and client info" />
  <title>Emme — Schedule &amp; Caseload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <style>
    :root {
      --green: #084339;
      --green-mid: #245E4D;
      --green-light: #4A7C6B;
      --pink: #f8cacb;
      --pink-dark: #dd9fa3;
      --yellow: #ffca34;
      --bg: #fef7fc;
      --surface: #ffffff;
      --border: rgba(8, 67, 57, 0.12);
      --text: #084339;
      --body: #2a3a38;
      --muted: rgba(8, 67, 57, 0.55);
      --faint: rgba(8, 67, 57, 0.28);
      --day-blue: #1e3a5f;
      --day-maroon: #6b2d3c;
      --radius: 0.75rem;
      --shadow: 0 4px 18px rgba(8, 67, 57, 0.08);
      --font-display: 'Comfortaa', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--body);
      min-height: 100vh;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .is-hidden { display: none !important; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.85rem 1.5rem;
      background: var(--green); color: #fff;
      box-shadow: 0 2px 14px rgba(8, 67, 57, 0.2);
    }
    .topbar__brand {
      font-family: var(--font-display); font-weight: 700; font-size: 1.35rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .topbar__brand span { opacity: 0.7; font-weight: 500; font-size: 0.95rem; }
    .topbar__actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.7rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9);
    }
    .sync-pill--live { background: rgba(255, 202, 52, 0.22); color: #fff; }
    .sync-pill--local { background: rgba(248, 202, 203, 0.25); }
    .sync-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #7dcea0;
      box-shadow: 0 0 0 0 rgba(125, 206, 160, 0.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(125, 206, 160, 0.45); }
      70% { box-shadow: 0 0 0 6px rgba(125, 206, 160, 0); }
      100% { box-shadow: 0 0 0 0 rgba(125, 206, 160, 0); }
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.45rem 0.85rem; border-radius: 0.55rem;
      font-weight: 600; font-size: 0.85rem;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    .btn--yellow { background: var(--yellow); color: var(--green); }
    .btn--yellow:hover { filter: brightness(0.97); }
    .btn--ghost {
      background: transparent; color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .btn--ghost:hover { background: rgba(255,255,255,0.08); }
    .btn--green { background: var(--green); color: #fff; }
    .btn--green:hover { background: var(--green-mid); }
    .btn--soft {
      background: rgba(8, 67, 57, 0.07); color: var(--green);
      border: 1px solid var(--border);
    }
    .btn--soft:hover { background: rgba(8, 67, 57, 0.12); }
    .btn--danger { background: #fde8ea; color: #8b2e3a; }
    .btn--danger:hover { background: #f9d0d5; }
    .btn--sm { padding: 0.3rem 0.55rem; font-size: 0.78rem; }
    .btn--icon { padding: 0.35rem; border-radius: 0.45rem; }

    .shell { max-width: 1400px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .toolbar__left, .toolbar__right { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    .board-tabs {
      display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center;
      padding: 0.25rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .board-tab {
      padding: 0.45rem 0.85rem; border-radius: 0.5rem;
      font-weight: 600; font-size: 0.85rem; color: var(--muted);
    }
    .board-tab:hover { color: var(--green); background: rgba(8,67,57,0.05); }
    .board-tab--active {
      background: var(--green); color: #fff;
    }

    .layout-switch {
      display: inline-flex; padding: 0.2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .layout-switch__btn {
      padding: 0.4rem 0.75rem; border-radius: 0.45rem;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .layout-switch__btn--active {
      background: var(--green); color: #fff;
    }

    .toast {
      position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 80;
      background: var(--green); color: #fff;
      padding: 0.75rem 1rem; border-radius: 0.65rem;
      box-shadow: 0 8px 24px rgba(8,67,57,0.25);
      font-size: 0.875rem; font-weight: 500;
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast--show { opacity: 1; transform: translateY(0); }

    /* Status pills */
    .status {
      display: inline-flex; align-items: center;
      padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
      border: 1px solid transparent;
    }
    .status--full { background: #f8cacb; color: #7a2f38; }
    .status--open4 { background: #d4edda; color: #1e5c33; }
    .status--open2, .status--open1 { background: #ffe8a3; color: #6b4e00; }
    .status--progress { background: #ffd0a8; color: #7a3d00; }
    .status--lunch { background: #cfe8f5; color: #1a4d66; }
    .status--makeup { background: #e4d4f5; color: #4b2d6b; }
    .status--closed { background: #6b2d3c; color: #fff; }
    .status--blank { background: #f0e8ef; color: var(--muted); }

    /* Schedule layout (boss-friendly day stacks) */
    .sched-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.7fr);
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 980px) {
      .sched-layout { grid-template-columns: 1fr; }
    }
    .day-stack { display: flex; flex-direction: column; gap: 1rem; }
    .day-block {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: var(--shadow);
    }
    .day-block__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; color: #fff; font-family: var(--font-display);
      font-weight: 700; font-size: 0.95rem;
    }
    .day-block__header--blue { background: var(--day-blue); }
    .day-block__header--maroon { background: var(--day-maroon); }
    .day-block__header .btn { color: #fff; border-color: rgba(255,255,255,0.35); }
    .slot-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .slot-table th {
      text-align: left; padding: 0.45rem 0.7rem;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); background: rgba(8,67,57,0.03);
      border-bottom: 1px solid var(--border);
    }
    .slot-table td {
      padding: 0.4rem 0.55rem; border-bottom: 1px solid rgba(8,67,57,0.06);
      vertical-align: middle;
    }
    .slot-table tr:last-child td { border-bottom: none; }
    .slot-table tr:hover td { background: rgba(8,67,57,0.025); }
    .cell-input, .cell-select {
      width: 100%; border: 1px solid transparent; background: transparent;
      border-radius: 0.4rem; padding: 0.3rem 0.4rem; color: var(--body);
    }
    .cell-input:hover, .cell-select:hover { border-color: var(--border); background: #fff; }
    .cell-input:focus, .cell-select:focus {
      outline: none; border-color: var(--green-light); background: #fff;
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }
    .slot-actions { display: flex; gap: 0.2rem; opacity: 0.35; }
    tr:hover .slot-actions { opacity: 1; }
    .col-drag { width: 2rem; text-align: center; }
    .drag-handle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.55rem; height: 1.55rem; border-radius: 0.35rem;
      color: var(--muted); cursor: grab; touch-action: none;
    }
    .drag-handle:hover { color: var(--green); background: rgba(8,67,57,0.07); }
    .drag-handle:active, tr.is-dragging .drag-handle { cursor: grabbing; }
    tr.is-dragging { opacity: 0.45; }
    tr.drop-before td { box-shadow: inset 0 2px 0 0 var(--yellow); }
    tr.drop-after td { box-shadow: inset 0 -2px 0 0 var(--yellow); }
    .slot-link {
      margin-top: 0.25rem; padding: 0.3rem 0.45rem;
      background: rgba(8,67,57,0.05); border-radius: 0.4rem;
      font-size: 0.72rem; color: var(--muted); line-height: 1.35;
      display: flex; flex-wrap: wrap; gap: 0.35rem 0.65rem; align-items: center;
    }
    .slot-link button {
      color: var(--green); font-weight: 700; text-decoration: underline;
      text-underline-offset: 2px; font-size: 0.72rem;
    }
    .slot-link--empty { display: none; }

    .client-side {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
      position: sticky; top: 4.5rem;
    }
    .client-side__header {
      background: var(--day-blue); color: #fff;
      padding: 0.7rem 0.9rem; font-family: var(--font-display);
      font-weight: 700; display: flex; justify-content: space-between; align-items: center;
    }
    .client-side__list { max-height: min(70vh, 720px); overflow: auto; }
    .client-side__row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 0.5rem;
      padding: 0.65rem 0.85rem; border-bottom: 1px solid rgba(8,67,57,0.06);
      align-items: center; cursor: pointer;
    }
    .client-side__row:hover { background: rgba(8,67,57,0.03); }
    .client-side__name { font-weight: 600; color: var(--green); font-size: 0.88rem; }
    .client-side__meta { font-size: 0.75rem; color: var(--muted); }
    .client-side__hours {
      font-size: 0.78rem; font-weight: 700; color: var(--green-mid);
      background: rgba(8,67,57,0.07); padding: 0.15rem 0.45rem; border-radius: 999px;
    }

    /* Schedule + Clients layouts */

    /* Clients layout */
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .client-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .client-card__head {
      background: linear-gradient(135deg, var(--green), var(--green-mid));
      color: #fff; padding: 0.85rem 1rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
    }
    .client-card__name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .client-card__sessions { font-size: 0.78rem; opacity: 0.85; margin-top: 0.2rem; }
    .client-card__body { padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
    .info-row {
      display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 0.4rem;
      align-items: start; font-size: 0.84rem;
    }
    .info-row__label { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; padding-top: 0.15rem; }
    .info-row__value { color: var(--body); word-break: break-word; }
    .info-row__value a { color: var(--green-mid); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .copy-btn {
      padding: 0.2rem; border-radius: 0.35rem; color: var(--muted);
    }
    .copy-btn:hover { background: rgba(8,67,57,0.07); color: var(--green); }
    .client-card__tasks {
      margin: 0 1rem 1rem; padding: 0.65rem 0.75rem;
      background: rgba(221, 159, 163, 0.12); border-radius: 0.55rem;
      border: 1px dashed rgba(221, 159, 163, 0.5);
    }
    .client-card__tasks h4 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: #8b4a52; margin-bottom: 0.35rem;
    }
    .client-card__tasks textarea {
      width: 100%; border: none; background: transparent; resize: vertical;
      min-height: 2.5rem; color: var(--body);
    }
    .client-card__tasks textarea:focus { outline: none; }

    .empty {
      text-align: center; padding: 2.5rem 1rem; color: var(--muted);
    }
    .empty h3 { font-family: var(--font-display); color: var(--green); margin-bottom: 0.35rem; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(8, 67, 57, 0.35);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal__panel {
      background: var(--surface); border-radius: 1rem;
      width: min(520px, 100%); max-height: 90vh; overflow: auto;
      box-shadow: 0 16px 48px rgba(8,67,57,0.25); padding: 1.25rem;
    }
    .modal__title {
      font-family: var(--font-display); font-size: 1.2rem; color: var(--green);
      margin-bottom: 1rem;
    }
    .field { margin-bottom: 0.75rem; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 0.55rem 0.7rem;
      border: 1px solid var(--border); border-radius: 0.5rem;
      background: #fff; color: var(--body);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--green-light);
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
    .modal__actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

    .dx-panel {
      margin-top: 1.25rem; padding: 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .dx-panel h3 {
      font-family: var(--font-display); font-size: 0.95rem; color: var(--green);
      margin-bottom: 0.5rem;
    }
    .dx-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .dx-chip {
      font-size: 0.75rem; padding: 0.25rem 0.55rem;
      background: rgba(8,67,57,0.06); border-radius: 999px; color: var(--green-mid);
    }

    .search-bar { margin-bottom: 1rem; }
    .search-bar input {
      width: min(420px, 100%); padding: 0.55rem 0.85rem;
      border: 1px solid var(--border); border-radius: 0.55rem;
      background: var(--surface); color: var(--body);
      box-shadow: var(--shadow);
    }
    .search-bar input:focus {
      outline: none; border-color: var(--green-light);
      box-shadow: 0 0 0 3px rgba(8,67,57,0.08);
    }

    .cell-select.status-tint--full { background: #f8cacb; }
    .cell-select.status-tint--open4 { background: #d4edda; }
    .cell-select.status-tint--open2,
    .cell-select.status-tint--open1 { background: #ffe8a3; }
    .cell-select.status-tint--progress { background: #ffd0a8; }
    .cell-select.status-tint--lunch { background: #cfe8f5; }
    .cell-select.status-tint--makeup { background: #e4d4f5; }
    .cell-select.status-tint--closed { background: #6b2d3c; color: #fff; }
    .cell-select.status-tint--blank { background: transparent; }

    [data-lucide] { width: 1rem; height: 1rem; display: block; }
    .icon-sm [data-lucide], .icon-sm { width: 0.9rem; height: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      Emme <span>/ Schedule &amp; Caseload</span>
    </a>
    <div class="topbar__actions">
      <span class="sync-pill" id="js-sync-pill" title="Sync status">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="js-sync-label">Loading…</span>
      </span>
      <button type="button" class="btn btn--ghost" id="js-spreadsheet" title="Download an Excel spreadsheet">Spreadsheet</button>
      <button type="button" class="btn btn--ghost" id="js-pdf" title="Open a PDF you can save or print">PDF</button>
      <button type="button" class="btn btn--ghost" id="js-share" title="Share a link with your bosses">Share</button>
      <button type="button" class="btn btn--ghost" id="js-import" title="Import clients from a spreadsheet, PDF, Word doc, or text file">Import</button>
      <input type="file" id="js-import-file" class="sr-only" multiple />
      <a class="btn btn--yellow" href="index.html">← Dashboard</a>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div class="toolbar__left">
        <div class="board-tabs" id="js-board-tabs" role="tablist" aria-label="Schedules"></div>
        <button type="button" class="btn btn--soft btn--sm" id="js-add-board" title="Add schedule board">+ Board</button>
        <button type="button" class="btn btn--soft btn--sm" id="js-rename-board" title="Rename board">Rename</button>
        <button type="button" class="btn btn--danger btn--sm" id="js-delete-board" title="Delete board">Delete</button>
      </div>
      <div class="toolbar__right">
        <div class="layout-switch" role="group" aria-label="Layout">
          <button type="button" class="layout-switch__btn layout-switch__btn--active" data-layout="schedule" id="js-layout-schedule">
            <i data-lucide="calendar-days"></i> Schedule
          </button>
          <button type="button" class="layout-switch__btn" data-layout="clients" id="js-layout-clients">
            <i data-lucide="users"></i> Clients
          </button>
        </div>
        <button type="button" class="btn btn--green btn--sm" id="js-add-slot">+ Slot</button>
        <button type="button" class="btn btn--soft btn--sm" id="js-add-day">+ Day</button>
        <button type="button" class="btn btn--soft btn--sm" id="js-add-client">+ Client</button>
      </div>
    </div>

    <div class="search-bar is-hidden" id="js-client-search-wrap">
      <input type="search" id="js-client-search" placeholder="Search clients by name, email, phone, agency…" aria-label="Search clients" />
    </div>

    <div id="js-view-schedule"></div>
    <div id="js-view-clients" class="is-hidden"></div>

    <section class="dx-panel" id="js-dx-panel" aria-label="Diagnostic codes">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
        <h3 style="margin:0">Diagnostic codes</h3>
        <button type="button" class="btn btn--soft btn--sm" id="js-edit-dx">Edit codes</button>
      </div>
      <div class="dx-list" id="js-dx-list"></div>
    </section>
  </main>

  <div class="toast" id="js-toast" role="status" aria-live="polite"></div>

  <div class="modal is-hidden" id="js-share-modal" role="dialog" aria-modal="true" aria-labelledby="js-share-title">
    <div class="modal__panel">
      <h2 class="modal__title" id="js-share-title">Share schedule</h2>
      <p id="js-share-status" style="color:var(--muted);font-size:0.92rem">Creating a link your bosses can open while signed in to Emme…</p>
      <input id="js-share-link" class="cell-input" readonly style="width:100%;margin:0.75rem 0" />
      <div class="modal__actions">
        <button type="button" class="btn btn--green" id="js-share-copy">Copy link</button>
        <a class="btn btn--soft" id="js-share-email" href="#">Email link</a>
        <button type="button" class="btn btn--soft" id="js-share-close">Close</button>
      </div>
    </div>
  </div>

  <div class="modal is-hidden" id="js-modal" role="dialog" aria-modal="true" aria-labelledby="js-modal-title">
    <div class="modal__panel">
      <h2 class="modal__title" id="js-modal-title">Edit</h2>
      <div id="js-modal-body"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--soft" id="js-modal-cancel">Cancel</button>
        <button type="button" class="btn btn--green" id="js-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  var userScope = 'device';
  function storageKey() { return 'emme_schedule_workspace_v1:' + userScope; }
  function layoutKey() { return 'emme_schedule_layout:' + userScope; }
  function boardKey() { return 'emme_schedule_board:' + userScope; }
  var POLL_MS = 6000;
  var SAVE_DEBOUNCE_MS = 700;

  var STATUS_OPTIONS = [
    { value: '', label: '—', cls: 'blank' },
    { value: 'Full', label: 'Full', cls: 'full' },
    { value: 'Open 4x', label: 'Open 4x', cls: 'open4' },
    { value: 'Open 2x (1&3)', label: 'Open 2x (1&3)', cls: 'open2' },
    { value: 'Open 2x (2&4)', label: 'Open 2x (2&4)', cls: 'open2' },
    { value: 'Open 1x (1)', label: 'Open 1x (1)', cls: 'open1' },
    { value: 'Open 1x (2)', label: 'Open 1x (2)', cls: 'open1' },
    { value: 'Open 1x (3)', label: 'Open 1x (3)', cls: 'open1' },
    { value: 'Open 1x (4)', label: 'Open 1x (4)', cls: 'open1' },
    { value: 'Scheduling In Progress', label: 'Scheduling In Progress', cls: 'progress' },
    { value: 'Lunch', label: 'Lunch', cls: 'lunch' },
    { value: 'Makeup', label: 'Makeup', cls: 'makeup' },
    { value: 'Not Open', label: 'Not Open', cls: 'closed' }
  ];

  var DEFAULT_DX = [
    'F80.0 — Phonological Disorder',
    'F80.1 — Expressive Language Disorder',
    'F80.2 — Mixed Receptive-Expressive Language Disorder',
    'F80.81 — Childhood Onset Fluency Disorder',
    'F80.9 — Developmental Disorder of Speech and Language, Unspecified',
    'F84.0 — Autistic Disorder',
    'R48.8 — Other Symbolic Dysfunctions (Pragmatic Language)'
  ];

  var state = {
    workspace: null,
    cloudConfigured: false,
    layout: 'schedule',
    activeBoardId: '',
    clientQuery: '',
    saving: false,
    dirty: false,
    lastRemoteUpdatedAt: null,
    pollTimer: null,
    saveTimer: null,
    modalMode: null,
    modalContext: null,
    suppressPoll: false
  };

  var bc = null;

  async function resolveUserScope() {
    try {
      var res = await fetch('/.auth/me', { credentials: 'same-origin' });
      if (!res.ok) return 'device';
      var data = await res.json();
      var principal = data && data.clientPrincipal;
      if (!principal) return 'device';
      var id = String(principal.userId || principal.userDetails || 'device').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 80);
      return id || 'device';
    } catch (_) { return 'device'; }
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  function statusClass(value) {
    var found = STATUS_OPTIONS.find(function (s) { return s.value === value; });
    return found ? found.cls : 'blank';
  }

  function toast(msg) {
    var el = document.getElementById('js-toast');
    el.textContent = msg;
    el.classList.add('toast--show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('toast--show'); }, 2200);
  }

  async function copyText(text) {
    var value = String(text || '').trim();
    if (!value) return;
    try {
      await navigator.clipboard.writeText(value);
      toast('Copied');
    } catch (_) {
      var ta = document.createElement('textarea');
      ta.value = value;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast('Copied');
    }
  }

  function iconize() {
    if (window.lucide && lucide.createIcons) lucide.createIcons();
  }

  function defaultBoard(name) {
    var days = [
      { id: uid('day'), name: 'Monday', color: 'blue', slots: [] },
      { id: uid('day'), name: 'Tuesday', color: 'maroon', slots: [] },
      { id: uid('day'), name: 'Wednesday', color: 'blue', slots: [] },
      { id: uid('day'), name: 'Thursday', color: 'maroon', slots: [] },
      { id: uid('day'), name: 'Friday', color: 'blue', slots: [] }
    ];
    var starterTimes = {
      Monday: ['4:00 PM', '4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Tuesday: ['4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Wednesday: ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '4:30 PM', '5:30 PM', '6:30 PM'],
      Thursday: ['9:00 AM', '10:00 AM', '11:00 AM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM', '5:00 PM', '5:30 PM', '6:00 PM', '6:30 PM'],
      Friday: ['4:30 PM', '5:30 PM', '6:30 PM']
    };
    days.forEach(function (day) {
      (starterTimes[day.name] || []).forEach(function (time) {
        day.slots.push({ id: uid('slot'), time: time, status: '', notes: '', lastDay: '' });
      });
    });
    return { id: uid('board'), name: name || 'Current Schedule', days: days };
  }

  function seedWorkspace() {
    return {
      version: 1,
      updatedAt: new Date().toISOString(),
      boards: [
        defaultBoard('Current Schedule'),
        { id: uid('board'), name: "Summer '26 Schedule", days: defaultBoard().days.map(function (d) {
          return { id: uid('day'), name: d.name, color: d.color, slots: d.slots.map(function (s) {
            return { id: uid('slot'), time: s.time, status: '', notes: '', lastDay: '' };
          }) };
        }) },
        { id: uid('board'), name: 'Clients not in regular spot', days: [] }
      ],
      clients: [],
      dxCodes: DEFAULT_DX.slice()
    };
  }

  function activeBoard() {
    var ws = state.workspace;
    if (!ws || !ws.boards.length) return null;
    var board = ws.boards.find(function (b) { return b.id === state.activeBoardId; });
    if (!board) {
      board = ws.boards[0];
      state.activeBoardId = board.id;
      localStorage.setItem(boardKey(), board.id);
    }
    return board;
  }

  function setSyncLabel(text, mode) {
    var pill = document.getElementById('js-sync-pill');
    var label = document.getElementById('js-sync-label');
    label.textContent = text;
    pill.classList.toggle('sync-pill--live', mode === 'live');
    pill.classList.toggle('sync-pill--local', mode === 'local');
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(storageKey());
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) { return null; }
  }

  function saveLocal(workspace) {
    localStorage.setItem(storageKey(), JSON.stringify(workspace));
    if (bc) {
      try { bc.postMessage({ type: 'workspace', updatedAt: workspace.updatedAt }); } catch (_) {}
    }
  }

  async function loadCloud() {
    var res = await fetch('/api/schedule', { credentials: 'include' });
    var data = await res.json().catch(function () { return {}; });
    if (res.status === 503 || data.configured === false) {
      return { configured: false };
    }
    if (!res.ok) throw new Error(data.error || 'Could not load schedule');
    return { configured: true, workspace: data.workspace };
  }

  async function saveCloud(workspace) {
    var res = await fetch('/api/schedule', {
      method: 'PUT',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workspace: workspace })
    });
    var data = await res.json().catch(function () { return {}; });
    if (res.status === 503 || data.configured === false) {
      return { configured: false };
    }
    if (!res.ok) throw new Error(data.error || 'Could not save schedule');
    return { configured: true, workspace: data.workspace };
  }

  async function pollMeta() {
    if (!state.cloudConfigured || state.suppressPoll || state.dirty || state.saving) return;
    try {
      var res = await fetch('/api/schedule/meta', { credentials: 'include' });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.configured) return;
      if (data.updatedAt && state.lastRemoteUpdatedAt && data.updatedAt !== state.lastRemoteUpdatedAt) {
        var loaded = await loadCloud();
        if (loaded.configured && loaded.workspace) {
          state.workspace = loaded.workspace;
          state.lastRemoteUpdatedAt = loaded.workspace.updatedAt;
          saveLocal(state.workspace);
          renderAll();
          setSyncLabel('Live · updated', 'live');
        }
      }
    } catch (_) {}
  }

  function scheduleSave() {
    state.dirty = true;
    setSyncLabel(state.cloudConfigured ? 'Saving…' : 'Saving on device…', state.cloudConfigured ? 'live' : 'local');
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(persist, SAVE_DEBOUNCE_MS);
  }

  async function persist() {
    if (!state.workspace) return;
    state.saving = true;
    state.suppressPoll = true;
    state.workspace.updatedAt = new Date().toISOString();
    saveLocal(state.workspace);
    try {
      if (state.cloudConfigured) {
        var result = await saveCloud(state.workspace);
        if (result.configured && result.workspace) {
          state.workspace = result.workspace;
          state.lastRemoteUpdatedAt = result.workspace.updatedAt;
          saveLocal(state.workspace);
          setSyncLabel('Live sync on', 'live');
        } else {
          state.cloudConfigured = false;
          setSyncLabel('Saved on this device', 'local');
        }
      } else {
        setSyncLabel('Saved on this device', 'local');
      }
      state.dirty = false;
    } catch (err) {
      setSyncLabel('Save failed — retrying', state.cloudConfigured ? 'live' : 'local');
      toast(err.message || 'Save failed');
    } finally {
      state.saving = false;
      setTimeout(function () { state.suppressPoll = false; }, 1200);
    }
  }

  function mutate(fn) {
    fn();
    renderAll();
    scheduleSave();
  }

  /* ─── Rendering ─── */

  function renderBoardTabs() {
    var el = document.getElementById('js-board-tabs');
    var boards = state.workspace.boards;
    el.innerHTML = boards.map(function (b) {
      var active = b.id === state.activeBoardId ? ' board-tab--active' : '';
      return '<button type="button" class="board-tab' + active + '" data-board="' + b.id + '" role="tab" aria-selected="' + (b.id === state.activeBoardId) + '">' +
        escapeHtml(b.name) + '</button>';
    }).join('');
  }

  function renderStatusSelect(value, attrs) {
    var cls = statusClass(value);
    return '<select class="cell-select status-tint--' + cls + '" ' + (attrs || '') + '>' +
      STATUS_OPTIONS.map(function (s) {
        return '<option value="' + escapeAttr(s.value) + '"' + (s.value === value ? ' selected' : '') + '>' +
          escapeHtml(s.label) + '</option>';
      }).join('') + '</select>';
  }

  function tintStatusSelect(el) {
    if (!el || !el.classList.contains('cell-select')) return;
    STATUS_OPTIONS.forEach(function (s) {
      el.classList.remove('status-tint--' + s.cls);
    });
    el.classList.add('status-tint--' + statusClass(el.value));
  }

  function normalizePersonName(name) {
    return String(name || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function findClientByName(name) {
    var key = normalizePersonName(name);
    if (!key || key.length < 2 || !state.workspace) return null;
    var clients = state.workspace.clients || [];
    var exact = [];
    var soft = [];
    clients.forEach(function (c) {
      var cn = normalizePersonName(c.name);
      if (!cn) return;
      if (cn === key) exact.push(c);
      else if (cn.indexOf(key) !== -1 || key.indexOf(cn) !== -1) soft.push(c);
    });
    if (exact.length) return exact[0];
    if (soft.length === 1) return soft[0];
    return null;
  }

  function slotLinkedClientHtml(slot) {
    var match = findClientByName(slot && slot.notes);
    if (!match) return '';
    var bits = [];
    if (match.dob) bits.push('DOB ' + escapeHtml(match.dob));
    if (match.email) bits.push(escapeHtml(match.email));
    if (match.phone) bits.push(escapeHtml(match.phone));
    if (match.sessions) bits.push(escapeHtml(match.sessions));
    return '<div class="slot-link">' +
      '<button type="button" data-open-client="' + escapeAttr(match.id) + '" title="Open client card">' +
        escapeHtml(match.name) + '</button>' +
      (bits.length ? '<span>' + bits.join(' · ') + '</span>' : '<span>Linked from Clients</span>') +
      '</div>';
  }

  function findDayById(dayId) {
    var board = activeBoard();
    if (!board) return null;
    return (board.days || []).find(function (d) { return d.id === dayId; }) || null;
  }

  function moveSlot(fromDayId, slotId, toDayId, beforeSlotId) {
    if (!fromDayId || !slotId || !toDayId) return false;
    var fromDay = findDayById(fromDayId);
    var toDay = findDayById(toDayId);
    if (!fromDay || !toDay) return false;
    var fromIdx = (fromDay.slots || []).findIndex(function (s) { return s.id === slotId; });
    if (fromIdx < 0) return false;
    if (fromDayId === toDayId && beforeSlotId === slotId) return false;
    if (fromDayId === toDayId && beforeSlotId) {
      var beforeIdx = fromDay.slots.findIndex(function (s) { return s.id === beforeSlotId; });
      if (beforeIdx === fromIdx || beforeIdx === fromIdx + 1) return false;
    }
    if (fromDayId === toDayId && !beforeSlotId && fromIdx === fromDay.slots.length - 1) return false;
    var slot = fromDay.slots.splice(fromIdx, 1)[0];
    if (beforeSlotId) {
      var insertAt = toDay.slots.findIndex(function (s) { return s.id === beforeSlotId; });
      if (insertAt < 0) toDay.slots.push(slot);
      else toDay.slots.splice(insertAt, 0, slot);
    } else {
      toDay.slots.push(slot);
    }
    return true;
  }

  function dragHandleHtml() {
    return '<td class="col-drag">' +
      '<span class="drag-handle" draggable="true" data-drag-handle title="Drag to reorder" aria-label="Drag to reorder" role="button" tabindex="0">' +
        '<i data-lucide="grip-vertical"></i>' +
      '</span></td>';
  }

  function renderClientSidebarHtml() {
    var clients = state.workspace.clients || [];
    var clientRows = clients.map(function (c) {
      return '<div class="client-side__row" data-open-client="' + c.id + '">' +
        '<div><div class="client-side__name">' + escapeHtml(c.name || 'Unnamed') + '</div>' +
        '<div class="client-side__meta">' + escapeHtml(c.sessions || '') + '</div></div>' +
        '<span class="client-side__hours">' + escapeHtml(c.hours || '') + '</span>' +
        '<button type="button" class="btn btn--icon btn--soft" data-action="edit-client" data-client="' + c.id + '" title="Edit"><i data-lucide="pencil"></i></button>' +
      '</div>';
    }).join('') || '<p class="empty" style="padding:1.25rem">No clients yet — add some, or open the Clients tab</p>';

    return '<aside class="client-side">' +
      '<div class="client-side__header"><span>Clients</span>' +
        '<button type="button" class="btn btn--ghost btn--sm" id="js-side-add-client">+ Add</button></div>' +
      '<div class="client-side__list">' + clientRows + '</div>' +
      '<p style="padding:0.65rem 0.85rem;font-size:0.72rem;color:var(--muted);border-top:1px solid var(--border);margin:0">' +
        'Full info cards with copyable email/phone live in the <strong>Clients</strong> tab.' +
      '</p>' +
    '</aside>';
  }

  function renderScheduleView() {
    var root = document.getElementById('js-view-schedule');
    var board = activeBoard();
    if (!board) {
      root.innerHTML = '<div class="empty"><h3>No schedule board</h3><p>Add a board to get started.</p></div>';
      return;
    }
    if (!board.days.length) {
      root.innerHTML = '<div class="empty"><h3>' + escapeHtml(board.name) + '</h3><p>This board has no day blocks yet.</p>' +
        '<button type="button" class="btn btn--green" id="js-seed-days">Add Mon–Fri days</button></div>';
      return;
    }

    var daysHtml = board.days.map(function (day) {
      var color = day.color === 'maroon' ? 'maroon' : 'blue';
      var rows = (day.slots || []).map(function (slot) {
        return '<tr data-day="' + day.id + '" data-slot="' + slot.id + '">' +
          dragHandleHtml() +
          '<td style="width:7.5rem"><input class="cell-input" data-field="time" value="' + escapeAttr(slot.time) + '" /></td>' +
          '<td style="width:11rem">' + renderStatusSelect(slot.status, 'data-field="status"') + '</td>' +
          '<td><input class="cell-input" data-field="notes" value="' + escapeAttr(slot.notes) + '" placeholder="Client / notes" />' +
            slotLinkedClientHtml(slot) + '</td>' +
          '<td style="width:8rem"><input class="cell-input" data-field="lastDay" value="' + escapeAttr(slot.lastDay) + '" placeholder="Last day" /></td>' +
          '<td style="width:4.5rem"><div class="slot-actions">' +
            '<button type="button" class="btn btn--icon btn--soft" data-action="dup-slot" title="Duplicate"><i data-lucide="copy"></i></button>' +
            '<button type="button" class="btn btn--icon btn--danger" data-action="del-slot" title="Delete"><i data-lucide="trash-2"></i></button>' +
          '</div></td></tr>';
      }).join('') || '<tr><td colspan="6" style="padding:0.85rem;color:var(--muted)">No slots — use + Slot</td></tr>';

      return '<article class="day-block" data-day-block="' + day.id + '">' +
        '<header class="day-block__header day-block__header--' + color + '">' +
          '<span>' + escapeHtml(day.name) + '</span>' +
          '<div style="display:flex;gap:0.35rem">' +
            '<button type="button" class="btn btn--ghost btn--sm" data-action="add-slot-day" data-day="' + day.id + '">+ Slot</button>' +
            '<button type="button" class="btn btn--ghost btn--sm" data-action="rename-day" data-day="' + day.id + '" title="Rename day">Rename</button>' +
            '<button type="button" class="btn btn--ghost btn--sm" data-action="toggle-day-color" data-day="' + day.id + '" title="Toggle header color">Color</button>' +
            '<button type="button" class="btn btn--ghost btn--sm" data-action="del-day" data-day="' + day.id + '" title="Delete day">✕</button>' +
          '</div>' +
        '</header>' +
        '<table class="slot-table"><thead><tr>' +
          '<th class="col-drag"></th><th>Time</th><th>Status</th><th>Notes</th><th>Last Day</th><th></th>' +
        '</tr></thead><tbody data-drop-day="' + day.id + '">' + rows + '</tbody></table></article>';
    }).join('');

    root.innerHTML =
      '<div class="sched-layout">' +
        '<div class="day-stack">' + daysHtml + '</div>' +
        renderClientSidebarHtml() +
      '</div>';
  }

  function renderClientsView() {
    var root = document.getElementById('js-view-clients');
    var q = (state.clientQuery || '').toLowerCase().trim();
    var clients = (state.workspace.clients || []).filter(function (c) {
      if (!q) return true;
      var blob = [c.name, c.email, c.phone, c.agency, c.parents, c.sessions, c.serviceCoordinator, c.scEmail, c.medicaid, c.tasks]
        .join(' ').toLowerCase();
      return blob.indexOf(q) !== -1;
    });
    if (!(state.workspace.clients || []).length) {
      root.innerHTML = '<div class="empty"><h3>No clients yet</h3><p>Add clients to build information cards with copyable email and phone.</p>' +
        '<button type="button" class="btn btn--green" id="js-empty-add-client">+ Add client</button></div>';
      return;
    }
    if (!clients.length) {
      root.innerHTML = '<div class="empty"><h3>No matches</h3><p>Try a different search.</p></div>';
      return;
    }
    root.innerHTML = '<div class="client-grid">' + clients.map(function (c) {
      return '<article class="client-card" data-client-card="' + c.id + '">' +
        '<div class="client-card__head">' +
          '<div><div class="client-card__name">' + escapeHtml(c.name || 'Unnamed') + '</div>' +
          '<div class="client-card__sessions">' + escapeHtml(c.sessions || 'No session set') + '</div></div>' +
          '<div style="display:flex;gap:0.25rem">' +
            '<button type="button" class="btn btn--ghost btn--icon" data-action="edit-client" data-client="' + c.id + '" title="Edit"><i data-lucide="pencil"></i></button>' +
            '<button type="button" class="btn btn--ghost btn--icon" data-action="del-client" data-client="' + c.id + '" title="Delete"><i data-lucide="trash-2"></i></button>' +
          '</div></div>' +
        '<div class="client-card__body">' +
          infoRow('DOB', c.dob) +
          infoRow('Parents', c.parents) +
          infoRow('Medicaid #', c.medicaid, true) +
          contactRow('Email', c.email, 'mailto') +
          contactRow('Phone', c.phone, 'tel') +
          infoRow('Agency', c.agency) +
          infoRow('Service Coord.', c.serviceCoordinator) +
          contactRow('SC Email', c.scEmail, 'mailto') +
          infoRow('Hours', c.hours) +
        '</div>' +
        '<div class="client-card__tasks">' +
          '<h4>Tasks to be completed</h4>' +
          '<textarea data-client-tasks="' + c.id + '" placeholder="Add tasks…">' + escapeHtml(c.tasks || '') + '</textarea>' +
        '</div></article>';
    }).join('') + '</div>';
  }

  function infoRow(label, value, copyable) {
    var v = value || '—';
    var copy = copyable && value
      ? '<button type="button" class="copy-btn" data-copy="' + escapeAttr(value) + '" title="Copy"><i data-lucide="copy"></i></button>'
      : '<span></span>';
    return '<div class="info-row"><div class="info-row__label">' + label + '</div>' +
      '<div class="info-row__value">' + escapeHtml(v) + '</div>' + copy + '</div>';
  }

  function contactRow(label, value, scheme) {
    if (!value) {
      return '<div class="info-row"><div class="info-row__label">' + label + '</div>' +
        '<div class="info-row__value">—</div><span></span></div>';
    }
    var href = scheme === 'tel'
      ? 'tel:' + String(value).replace(/[^\d+]/g, '')
      : 'mailto:' + String(value).trim();
    return '<div class="info-row"><div class="info-row__label">' + label + '</div>' +
      '<div class="info-row__value"><a href="' + href + '">' + escapeHtml(value) + '</a></div>' +
      '<button type="button" class="copy-btn" data-copy="' + escapeAttr(value) + '" title="Copy"><i data-lucide="copy"></i></button></div>';
  }

  function renderDx() {
    var list = document.getElementById('js-dx-list');
    var codes = state.workspace.dxCodes || [];
    list.innerHTML = codes.map(function (c) {
      return '<span class="dx-chip">' + escapeHtml(c) + '</span>';
    }).join('') || '<span class="dx-chip">No codes</span>';
  }

  function showLayout() {
    if (state.layout !== 'schedule' && state.layout !== 'clients') {
      state.layout = 'schedule';
      localStorage.setItem(layoutKey(), state.layout);
    }
    var layout = state.layout;
    document.getElementById('js-view-schedule').classList.toggle('is-hidden', layout !== 'schedule');
    document.getElementById('js-view-clients').classList.toggle('is-hidden', layout !== 'clients');
    document.getElementById('js-client-search-wrap').classList.toggle('is-hidden', layout !== 'clients');
    document.querySelectorAll('.layout-switch__btn').forEach(function (btn) {
      btn.classList.toggle('layout-switch__btn--active', btn.getAttribute('data-layout') === layout);
    });
    document.getElementById('js-add-slot').style.display = layout === 'clients' ? 'none' : '';
    document.getElementById('js-add-day').style.display = layout === 'clients' ? 'none' : '';
  }

  function renderAll() {
    renderBoardTabs();
    showLayout();
    renderScheduleView();
    renderClientsView();
    renderDx();
    iconize();
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    var slot = (day.slots || []).find(function (s) { return s.id === slotId; });

  function onSlotFieldChange(target) {
    var tr = target.closest('tr[data-slot]');
    if (!tr) return;
    var found = findSlot(tr.getAttribute('data-day'), tr.getAttribute('data-slot'));
    if (!found) return;
    var field = target.getAttribute('data-field');
    if (!field) return;
    found.slot[field] = target.value;
    if (field === 'status') tintStatusSelect(target);
    if (field === 'notes') {
      var cell = target.closest('td');
      if (cell) {
        var old = cell.querySelector('.slot-link');
        if (old) old.remove();
        var html = slotLinkedClientHtml(found.slot);
        if (html) cell.insertAdjacentHTML('beforeend', html);
      }

    scheduleSave();
  }

  var rowDrag = { active: false, dayId: '', slotId: '', row: null };

  function clearDropMarkers() {
    document.querySelectorAll('tr.drop-before, tr.drop-after, tr.is-dragging').forEach(function (el) {
      el.classList.remove('drop-before', 'drop-after', 'is-dragging');
    });
  }

  document.addEventListener('dragstart', function (e) {
    var handle = e.target.closest('[data-drag-handle]');
    if (!handle) return;
    var row = handle.closest('tr[data-slot]');
    if (!row) return;
    e.stopPropagation();
    rowDrag.active = true;
    rowDrag.dayId = row.getAttribute('data-day') || '';
    rowDrag.slotId = row.getAttribute('data-slot') || '';
    rowDrag.row = row;
    row.classList.add('is-dragging');
    try {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', rowDrag.slotId);
      if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(row, 24, 16);
    } catch (_) {}
  });

  document.addEventListener('dragend', function () {
    rowDrag.active = false;
    rowDrag.dayId = '';
    rowDrag.slotId = '';
    rowDrag.row = null;
    clearDropMarkers();
  });

  document.addEventListener('dragover', function (e) {
    if (!rowDrag.active) return;
    var row = e.target.closest('tr[data-slot]');
    if (!row) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
    clearDropMarkers();
    if (rowDrag.row) rowDrag.row.classList.add('is-dragging');
    if (row.getAttribute('data-slot') === rowDrag.slotId) return;
    var rect = row.getBoundingClientRect();
    var before = (e.clientY - rect.top) < rect.height / 2;
    row.classList.add(before ? 'drop-before' : 'drop-after');
  });

  document.addEventListener('drop', function (e) {
    if (!rowDrag.active) return;
    var row = e.target.closest('tr[data-slot]');
    if (!row) return;
    e.preventDefault();
    var fromDayId = rowDrag.dayId;
    var slotId = rowDrag.slotId;
    var toDayId = row.getAttribute('data-day') || '';
    var beforeSlotId = null;
    if (row.getAttribute('data-slot') !== slotId) {
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      if (before) beforeSlotId = row.getAttribute('data-slot');
      else {
        var next = row.nextElementSibling;
        beforeSlotId = (next && next.getAttribute('data-slot')) ? next.getAttribute('data-slot') : null;
      }
    }
    clearDropMarkers();
    rowDrag.active = false;
    if (!toDayId || !slotId) return;
    mutate(function () {
      moveSlot(fromDayId, slotId, toDayId, beforeSlotId);
    });
  });

  function normalizeLabel(value) {
    return String(value || '').toLowerCase().replace(/[#_./-]+/g, ' ').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function fieldForLabel(label) {
    var n = normalizeLabel(label);
    if (!n) return '';
    var i, j, names;
    for (i = 0; i < CLIENT_FIELDS.length; i++) {
      names = CLIENT_FIELDS[i][1];
      for (j = 0; j < names.length; j++) if (n === names[j]) return CLIENT_FIELDS[i][0];
    }
    for (i = 0; i < CLIENT_FIELDS.length; i++) {
      names = CLIENT_FIELDS[i][1];
      for (j = 0; j < names.length; j++) {
        if (names[j].length < 4) continue;
        if (n.indexOf(names[j]) !== -1) return CLIENT_FIELDS[i][0];
      }
    }
    return '';
  }

  function cleanClient(raw) {
    var client = {};
    if (!raw) return client;
    Object.keys(raw).forEach(function (key) {
      var value = String(raw[key] == null ? '' : raw[key]).trim();
      if (value) client[key] = value;
    });
    return client;
  }

  function clientHasIdentity(client) {

  function parseDelimited(text) {
    var sample = String(text || '').split(/\r?\n/)[0] || '';
    var delim = (sample.split('\t').length > sample.split(',').length) ? '\t' : ',';
    var rows = [];
    var row = [];
    var cell = '';
    var inQuotes = false;
    text = String(text || '').replace(/^\uFEFF/, '');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; }
          else inQuotes = false;
        } else cell += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function clientsFromMatrix(rows) {
    var clients = [];
    var i = 0;
    while (i < rows.length) {
      var headerText = (rows[i] || []).map(normalizeLabel).join(' ');
      if (headerText.indexOf('time') !== -1 && headerText.indexOf('last day') !== -1) {
        i++;
        while (i < rows.length && (rows[i] || []).some(function (cell) { return String(cell || '').trim(); })) i++;
        continue;
      }
      var header = (rows[i] || []).map(fieldForLabel);
      var recognized = header.filter(Boolean).length;
      if (recognized >= 2 || header.indexOf('name') !== -1) {
        i++;
        while (i < rows.length) {
          var source = rows[i] || [];
          if (!source.some(function (cell) { return String(cell || '').trim(); })) break;
          var client = {};
          header.forEach(function (field, idx) {
            if (!field) return;
            var value = String(source[idx] == null ? '' : source[idx]).trim();
            if (value && !client[field]) client[field] = value;
          });
          client = cleanClient(client);
          if (clientHasIdentity(client)) clients.push(client);
          i++;
        }
      }
      i++;
    }
    return clients;
  }

  function parseLabeledText(text) {
    var source = String(text || '').replace(/\r/g, '\n');
    var labels = [];
    CLIENT_FIELDS.forEach(function (pair) {
      pair[1].forEach(function (label) { labels.push(label); });
    });
    labels.sort(function (a, b) { return b.length - a.length; });
    var alternation = labels.map(function (label) {
      return label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
    }).join('|');
    var re = new RegExp('(?:^|\\n|\\s{2,})(' + alternation + ')\\s*[:\\-]\\s*', 'ig');
    var matches = [];
    var found;
    while ((found = re.exec(source))) {
      matches.push({ index: found.index, end: re.lastIndex, label: found[1] });
    }
    if (!matches.length) return [];
    var clients = [];
    var current = {};
    matches.forEach(function (item, idx) {
      var field = fieldForLabel(item.label);
      var valueEnd = idx + 1 < matches.length ? matches[idx + 1].index : source.length;
      var value = source.slice(item.end, valueEnd).replace(/\s+/g, ' ').trim();
      if (field === 'name' && current.name) {
        if (clientHasIdentity(current)) clients.push(cleanClient(current));
        current = {};
      }
      if (field && value && !current[field]) current[field] = value;
    });
    if (clientHasIdentity(current)) clients.push(cleanClient(current));
    return clients;
  }

  function remapClient(item) {
    var known = {};
    CLIENT_FIELDS.forEach(function (pair) { known[pair[0]] = true; });
    var client = {};
    Object.keys(item || {}).forEach(function (key) {
      if (key === 'id') return;
      var field = known[key] ? key : fieldForLabel(key);
      var value = String(item[key] == null ? '' : item[key]).trim();
      if (field && value) client[field] = value;
    });
    return client;
  }

  function clientsFromJson(parsed) {
    if (Array.isArray(parsed)) return parsed.map(remapClient).filter(clientHasIdentity);
    if (parsed && Array.isArray(parsed.clients)) return parsed.clients.map(remapClient).filter(clientHasIdentity);
    return [];
  }

  function mergeClients(incoming) {
    var added = 0;
    var updated = 0;
    if (!state.workspace.clients) state.workspace.clients = [];
    incoming.forEach(function (row) {
      var client = cleanClient(row);
      if (!clientHasIdentity(client)) return;
      var nameKey = normalizePersonName(client.name);
      var emailKey = String(client.email || '').toLowerCase();
      var existing = state.workspace.clients.find(function (current) {
        if (nameKey && normalizePersonName(current.name) === nameKey) return true;
        return emailKey && String(current.email || '').toLowerCase() === emailKey;
      });
      if (existing) {
        Object.keys(client).forEach(function (key) { existing[key] = client[key]; });
        updated++;
      } else {
        client.id = uid('client');
        state.workspace.clients.push(client);
        added++;
      }
    });
    return { added: added, updated: updated };
  }

  function applyImport(kind, payload) {
    if (kind === 'workspace') {
      mutate(function () {
        state.workspace = {
          version: payload.version || 1,
          updatedAt: new Date().toISOString(),
          boards: payload.boards,
          clients: payload.clients || [],
          dxCodes: payload.dxCodes || DEFAULT_DX.slice()
        };
        state.activeBoardId = state.workspace.boards[0] && state.workspace.boards[0].id;
      });
      toast('Imported schedule backup');
      return;
    }
    var counts = { added: 0, updated: 0 };
    state.layout = 'clients';
    try { localStorage.setItem(layoutKey(), 'clients'); } catch (_) {}
    mutate(function () { counts = mergeClients(payload); });
    if (!counts.added && !counts.updated) {
      toast('No client details found in that file');
      return;
    }
    var parts = [];
    if (counts.added) parts.push(counts.added + ' added');
    if (counts.updated) parts.push(counts.updated + ' updated');
    toast('Clients imported — ' + parts.join(', '));
  }

  async function textFromFile(file) {
    var name = String(file.name || '').toLowerCase();
    var buffer = await file.arrayBuffer();
    if (/\.(xlsx|xls|ods)$/.test(name) || /spreadsheet|excel|officedocument.spreadsheet/i.test(file.type || '')) {
      if (typeof XLSX === 'undefined') throw new Error('Spreadsheet reader did not load. Try a CSV instead.');
      var book = XLSX.read(buffer, { type: 'array' });
      var rows = [];
      book.SheetNames.forEach(function (sheetName) {
        rows = rows.concat(XLSX.utils.sheet_to_json(book.Sheets[sheetName], { header: 1, raw: false, defval: '' }));
      });
      return { kind: 'matrix', rows: rows };
    }
    if (/\.pdf$/.test(name) || file.type === 'application/pdf') {
      if (typeof pdfjsLib === 'undefined') throw new Error('PDF reader did not load. Try a spreadsheet or text file.');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      var pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      var text = '';
      for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        var page = await pdf.getPage(pageNum);
        var content = await page.getTextContent();
        text += content.items.map(function (item) { return item.str + (item.hasEOL ? '\n' : ' '); }).join('');
      }
      return { kind: 'text', text: text };
    }
    if (/\.docx$/.test(name)) {
      if (typeof mammoth === 'undefined') throw new Error('Word reader did not load. Save the document as PDF or CSV.');
      var result = await mammoth.extractRawText({ arrayBuffer: buffer });
      return { kind: 'text', text: result.value || '' };
    }
    var decoded = new TextDecoder('utf-8').decode(buffer);
    return { kind: 'text', text: decoded };
  }

  async function importFile(file) {
    var extracted = await textFromFile(file);
    if (extracted.kind === 'matrix') {
      var fromSheet = clientsFromMatrix(extracted.rows);
      if (!fromSheet.length) throw new Error('No client columns found in ' + file.name);
      applyImport('clients', fromSheet);
      return;
    }
    var text = String(extracted.text || '').replace(/^\uFEFF/, '').trim();
    if (!text) throw new Error(file.name + ' is empty');
    if (text.charAt(0) === '{' || text.charAt(0) === '[') {
      try {
        var parsed = JSON.parse(text);
        if (parsed && Array.isArray(parsed.boards)) {
          applyImport('workspace', parsed);
          return;
        }
        var fromJson = clientsFromJson(parsed);
        if (fromJson.length) {
          applyImport('clients', fromJson);
          return;
        }
      } catch (_) {}
    }
    var firstLine = text.split(/\n/)[0] || '';
    if ((firstLine.match(/,/g) || []).length || (firstLine.match(/\t/g) || []).length) {
      var fromTable = clientsFromMatrix(parseDelimited(text));
      if (fromTable.length) {
        applyImport('clients', fromTable);
        return;
      }
    }
    var fromLabels = parseLabeledText(text);
    if (fromLabels.length) {
      applyImport('clients', fromLabels);
      return;
    }
    throw new Error('Could not find client names, emails, or phones in ' + file.name);
  }

  document.getElementById('js-import').addEventListener('click', function () {
    var input = document.getElementById('js-import-file');
    input.removeAttribute('accept');
    input.value = '';
    input.click();
  });
  document.getElementById('js-import-file').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    files.reduce(function (chain, file) {
      return chain.then(function () { return importFile(file); });
    }, Promise.resolve()).catch(function (err) {
      toast(err.message || 'Import failed');
    });
  });

  async function init() {
    userScope = await resolveUserScope();
    state.layout = localStorage.getItem(layoutKey()) || 'schedule';
    state.activeBoardId = localStorage.getItem(boardKey()) || '';
    try { bc = new BroadcastChannel('emme_schedule_sync_' + userScope); } catch (_) {}
    if (bc) {
      bc.onmessage = function (ev) {
        if (!ev.data || ev.data.type !== 'workspace') return;
        if (state.dirty || state.saving) return;
        var local = loadLocal();
        if (local && local.updatedAt === ev.data.updatedAt) {
          state.workspace = local;
          renderAll();
        }
      };
    }
    setSyncLabel('Connecting…', 'local');
    var local = loadLocal();
    try {
      var cloud = await loadCloud();
      if (cloud.configured) {
        state.cloudConfigured = true;
        if (cloud.workspace && (cloud.workspace.boards || []).length) {
          state.workspace = cloud.workspace;
        } else if (local && (local.boards || []).length) {
          state.workspace = local;
          await persist();
        } else {
          state.workspace = seedWorkspace();
          await persist();
        }
        state.lastRemoteUpdatedAt = state.workspace.updatedAt;
        saveLocal(state.workspace);
        setSyncLabel('Live sync on', 'live');
        state.pollTimer = setInterval(pollMeta, POLL_MS);
      } else {
        state.cloudConfigured = false;
        state.workspace = (local && local.boards && local.boards.length) ? local : seedWorkspace();
        saveLocal(state.workspace);
        setSyncLabel('Saved on this device', 'local');
      }
    } catch (_) {
      state.cloudConfigured = false;
      state.workspace = (local && local.boards && local.boards.length) ? local : seedWorkspace();
      saveLocal(state.workspace);
      setSyncLabel('Saved on this device', 'local');
    }

    if (!state.activeBoardId || !state.workspace.boards.some(function (b) { return b.id === state.activeBoardId; })) {
      state.activeBoardId = state.workspace.boards[0].id;
      localStorage.setItem(boardKey(), state.activeBoardId);
    }
    renderAll();
  }

  init();
})();
  </script>
</body>
</html>
