<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emme — Signed out</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #084339;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 2rem; max-width: 28rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { margin: 0 0 1.5rem; opacity: 0.85; }
    a {
      display: inline-block;
      background: #ffca34;
      color: #084339;
      text-decoration: none;
      font-weight: 700;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <h1>You’re signed out</h1>
    <p>Sign in with your own Emme account. The next screen lets you choose which account to use.</p>
    <a href="/.auth/login/aad?prompt=select_account&amp;post_login_redirect_uri=/">Sign in</a>
  </main>
</body>
</html>
